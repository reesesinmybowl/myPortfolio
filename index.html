<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Niklas</title>
  <link rel="icon" href="assets/img/i-023.png" type="image/png">
  <script defer src="/ga-init.js"></script>
  <script defer src="/analytics.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #482714;
      --type: #FBCDCF;
      --solid: #ff6aa7;
      --cursor: #81cf49;
      --selection: #81cf49;
      --tracking: -0.08em;
      --hi-gap: -.01em;
      --there-gap: 0.015em;
      --designer-gn-gap: -0.028em;
    }

    @font-face {
      font-family: "ABC Monument Grotesk Trial";
      src: url("fonts/ABCMonumentGroteskTrial-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #fff;
      color: var(--type);
      font-family: Helvetica, Arial, sans-serif;
    }

    main {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--paper);
      transition: background 140ms linear;
      will-change: transform;
    }

    .text-wrap {
      position: relative;
      width: 1px;
      height: 1px;
      transform-origin: center center;
      will-change: transform;
      z-index: 1;
    }

    .sentence {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max-content;
      transform: translate(-50%, -50%);
      font-family: "ABC Monument Grotesk Trial", Helvetica, Arial, sans-serif;
      font-size: 160px;
      font-weight: normal;
      font-synthesis: none;
      line-height: .8;
      letter-spacing: var(--tracking);
      white-space: pre;
      color: var(--type);
      --x-band-top: 0;
      --x-band-height: 0.748em;
      --solid-y: 2px;
      transition: color 140ms linear;
    }

    #visibleText {
      display: block;
      outline: 0;
      caret-color: transparent;
    }

#visibleText ::selection,
    #visibleText::selection {
      background: var(--selection);
      color: var(--type);
    }

    .type-line {
      display: block;
      width: fit-content;
      position: relative;
      padding: 0;
      white-space: pre;
      --solid-scale: 1;
    }

    .line-text {
      display: inline-block;
      transform: translateX(var(--text-offset, 0px));
    }

    .hi-h,
    .there-t,
    .designer-g {
      display: inline-block;
    }

    .hi-h {
      margin-right: var(--hi-gap);
    }

    .there-t {
      margin-right: var(--there-gap);
    }

    .designer-g {
      margin-right: var(--designer-gn-gap);
    }

    .type-line::before {
      content: "";
      position: absolute;
      left: calc(var(--solid-left, 0px) * -1);
      right: calc(var(--solid-right, 0px) * -1);
      top: var(--x-band-top);
      height: var(--x-band-height);
      transform: translateY(var(--solid-y)) scaleX(var(--solid-scale));
      transform-origin: center;
      background: var(--solid);
      z-index: -1;
    }

    .type-line.active::before {
      animation: solidPop 180ms cubic-bezier(.2, .8, .2, 1);
    }

    .line-text.active {
      animation: letterSnap 180ms cubic-bezier(.2, .8, .2, 1);
    }

    .cursor {
      position: absolute;
      left: var(--caret-x, calc(100% + 0.08em));
      top: calc(var(--caret-y, 0px) + 0.16em);
      display: block;
      width: 0.065em;
      height: 0.82em;
      background: var(--cursor);
      opacity: 1;
      visibility: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .palette-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      display: flex;
      height: 140px;
      gap: 0;
      margin: 0;
      padding: 0;
    }

    .palette {
      appearance: none;
      flex: 1 1 0;
      height: 100%;
      border: 0;
      border-radius: 0;
      margin: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      position: relative;
    }

    .palette::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 10px;
      background: var(--swatch);
    }

    .palette:focus-visible {
      outline: 2px solid var(--type);
      outline-offset: -2px;
    }

    body.exporting .palette-bar {
      display: none;
    }

    body.is-peeking main {
      animation: pagePeek 1450ms cubic-bezier(.2, .8, .2, 1);
    }

    body.is-peeking .palette-bar {
      animation: palettePeek 1450ms cubic-bezier(.2, .8, .2, 1);
    }

    body.exporting .cursor {
      display: none;
    }

    .cursor.done {
      visibility: visible;
      animation: blink 900ms steps(1, end) infinite;
    }

    .measure {
      position: fixed;
      left: -10000px;
      top: -10000px;
      visibility: hidden;
      width: max-content;
      font-family: "ABC Monument Grotesk Trial", Helvetica, Arial, sans-serif;
      font-size: 160px;
      font-weight: normal;
      font-synthesis: none;
      letter-spacing: var(--tracking);
      line-height: .8;
      white-space: pre;
    }

    @keyframes blink {
      0%,
      48% {
        opacity: 1;
      }

      49%,
      100% {
        opacity: 0;
      }
    }

    @keyframes solidPop {
      0% {
        transform: translateY(var(--solid-y)) scaleX(0.72);
        filter: brightness(1.18);
      }

      100% {
        transform: translateY(var(--solid-y)) scaleX(var(--solid-scale));
        filter: brightness(1);
      }
    }

    @keyframes letterSnap {
      0% {
        transform: translateX(var(--text-offset, 0px)) translateY(0.14em) scaleY(0.82);
        filter: blur(7px);
        opacity: 0.25;
      }

      100% {
        transform: translateX(var(--text-offset, 0px)) translateY(0) scaleY(1);
        filter: blur(0);
        opacity: 1;
      }
    }

    @keyframes pagePeek {
      0%,
      100% {
        transform: translateY(0);
      }

      28%,
      72% {
        transform: translateY(-46px);
      }
    }

    @keyframes palettePeek {
      0%,
      100% {
        transform: translateY(0);
      }

      28%,
      72% {
        transform: translateY(-46px);
      }
    }

    @media (max-width: 720px) {
      .sentence,
      .measure {
        font-size: 136px;
      }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Hi There! My name is Niklas, I'm an Interactive Designer based in Copenhagen with a passion for typography, visual identities, 3D and motion graphics.">
    <div class="text-wrap" id="textWrap">
      <div class="sentence"><span id="visibleText"></span></div>
    </div>
  </main>
  <div class="palette-bar" aria-label="Color palettes">
    <button class="palette" type="button" aria-label="Overlue cyan palette" data-paper="#f4f6ef" data-type="#8b806f" data-solid="#64dce8" data-cursor="#ff4f9a" data-selection="#ff4f9a" style="--swatch: #64dce8;"></button>
    <button class="palette" type="button" aria-label="Steel red palette" data-paper="#c8f1ff" data-type="#0b2430" data-solid="#e0002a" data-cursor="#2458ff" data-selection="#2458ff" style="--swatch: #e0002a;"></button>
    <button class="palette" type="button" aria-label="Tomato cream palette" data-paper="#ffd2a6" data-type="#7f1010" data-solid="#ff3b1f" data-cursor="#1f5cff" data-selection="#1f5cff" style="--swatch: #ff3b1f;"></button>
    <button class="palette" type="button" aria-label="Ink violet palette" data-paper="#eee9ff" data-type="#24135f" data-solid="#5b2cff" data-cursor="#f0c400" data-selection="#f0c400" style="--swatch: #5b2cff;"></button>
    <button class="palette" type="button" aria-label="Brown pink palette" data-paper="#482714" data-type="#FBCDCF" data-solid="#ff6aa7" data-cursor="#81cf49" data-selection="#81cf49" style="--swatch: #ff6aa7;"></button>
    <button class="palette" type="button" aria-label="Sage lilac palette" data-paper="#e7eadf" data-type="#6e6a78" data-solid="#b8d79d" data-cursor="#ff6aa7" data-selection="#ff6aa7" style="--swatch: #b8d79d;"></button>
  </div>
  <div class="measure" id="measure"></div>

  <script>
    const lines = [
      "Hi There! My name is Niklas,",
      "I'm an Interactive Designer",
      "based in Copenhagen",
      "with a passion for typography,",
      "visual identities, 3D",
      "and motion graphics."
    ];
    const solidBleeds = [
      { left: 0, right: 0 },
      { left: 0, right: 0 },
      { left: 0, right: 0 },
      { left: 0, right: 0 },
      { left: 0, right: 0 },
      { left: 0, right: 0 }
    ];
    const textOffsets = [
      "-0.078em",
      "-0.075em",
      "-0.056em",
      "-0.011em",
      "-0.006em",
      "-0.038em"
    ];
    const sentence = lines.join(" ");
    const stage = document.getElementById("stage");
    const textWrap = document.getElementById("textWrap");
    const visibleText = document.getElementById("visibleText");
    const exportMode = new URLSearchParams(window.location.search).has("export");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    cursor.setAttribute("aria-hidden", "true");
    document.querySelector(".sentence").append(cursor);
    const measure = document.getElementById("measure");
    const palettes = document.querySelectorAll(".palette");

    const duration = 6200;
    const pause = 260;
    const introStopText = "Hi There!";
    const introHold = 620;
    const introDuration = 520;
    const debugNoAnimation = false;
    const ABOUT_INTRO_FINISHED_KEY = "aboutIntroFinished";
    let startFinished = false;
    let skipProjectPeek = false;
    let start = performance.now();
    let frame = 0;
    let editable = false;
    let currentScale = 1;
    let peekTimer = 0;
    let lastTouchAt = 0;

    if (exportMode) {
      document.body.classList.add("exporting");
    }

    try {
      startFinished = sessionStorage.getItem(ABOUT_INTRO_FINISHED_KEY) === "1";
      skipProjectPeek = startFinished;
      sessionStorage.removeItem(ABOUT_INTRO_FINISHED_KEY);
    } catch (_) {}

    function measureText(text) {
      measure.textContent = text || sentence.charAt(0);
      return measure.getBoundingClientRect();
    }

    function fitScale(text) {
      const bounds = measureText(text);
      const padding = 24;
      const fittedWidth = bounds.width + padding;
      const fittedHeight = bounds.height + padding;
      const scale = Math.min(
        window.innerWidth * 0.96 / fittedWidth,
        window.innerHeight * 0.94 / fittedHeight
      );

      return Math.min(8.5, scale);
    }

    function formatText(count) {
      const visibleLines = [];
      let remaining = count;

      for (const line of lines) {
        if (remaining <= 0) {
          break;
        }

        visibleLines.push(line.slice(0, remaining));
        remaining -= line.length + 1;
      }

      return visibleLines;
    }

    function renderTypedLines(visibleLines, showCursor = false) {
      visibleText.replaceChildren(
        ...visibleLines.map((line, index) => {
          const span = document.createElement("span");
          const text = document.createElement("span");
          const bleed = solidBleeds[index] || { left: 0, right: 0 };
          const offset = textOffsets[index] || 0;
          const isLastLine = index === visibleLines.length - 1;
          span.className = "type-line";
          text.className = "line-text";
          if (index === 0 && line.length > 3) {
            text.append(
              Object.assign(document.createElement("span"), {
                className: "hi-h",
                textContent: line.charAt(0)
              }),
              document.createTextNode(line.slice(1, 3)),
              Object.assign(document.createElement("span"), {
                className: "there-t",
                textContent: line.charAt(3)
              }),
              document.createTextNode(line.slice(4))
            );
          } else if (index === 1) {
            const pairIndex = line.indexOf("gn");
            if (pairIndex !== -1) {
              text.append(
                document.createTextNode(line.slice(0, pairIndex)),
                Object.assign(document.createElement("span"), {
                  className: "designer-g",
                  textContent: line.charAt(pairIndex)
                }),
                document.createTextNode(line.slice(pairIndex + 1))
              );
            } else {
              text.textContent = line;
            }
          } else {
            text.textContent = line;
          }
          text.style.setProperty("--text-offset", offset);

          span.append(text);
          span.style.setProperty("--solid-left", `${bleed.left}px`);
          span.style.setProperty("--solid-right", `${bleed.right}px`);
          return span;
        })
      );
    }

    function render(now) {
      if (debugNoAnimation || startFinished) {
        startFinished = false;
        renderFullText();
        return;
      }

      const elapsed = Math.max(0, now - start - pause);
      const introCount = introStopText.length;
      const remainingDuration = Math.max(1, duration - introDuration);
      let count = 1;
      let progress = 0;

      if (elapsed < introDuration) {
        const introProgress = elapsed / introDuration;
        const introEased = introProgress * introProgress * (3 - 2 * introProgress);
        count = Math.max(1, Math.ceil(introCount * introEased));
      } else if (elapsed < introDuration + introHold) {
        count = introCount;
      } else {
        const resumeElapsed = elapsed - introDuration - introHold;
        progress = Math.min(1, resumeElapsed / remainingDuration);
        const eased = 1 - Math.pow(1 - progress, 1.45);
        count = introCount + Math.ceil((sentence.length - introCount) * eased);
      }

      const visibleLines = formatText(count);
      const text = visibleLines.join("\n");
      const scale = fitScale(text);
      const done = count >= sentence.length;

      renderTypedLines(visibleLines, done);
      cursor.classList.toggle("done", done);
      currentScale = scale;
      textWrap.style.transform = `scale(${scale})`;

      if (done) {
        enableEditing();
        return;
      }

      frame = requestAnimationFrame(render);
    }

    function countAtElapsed(milliseconds) {
      const elapsed = Math.max(0, milliseconds - pause);
      const introCount = introStopText.length;
      const remainingDuration = Math.max(1, duration - introDuration);

      if (elapsed < introDuration) {
        const introProgress = elapsed / introDuration;
        const introEased = introProgress * introProgress * (3 - 2 * introProgress);
        return Math.max(1, Math.ceil(introCount * introEased));
      }

      if (elapsed < introDuration + introHold) {
        return introCount;
      }

      const resumeElapsed = elapsed - introDuration - introHold;
      const progress = Math.min(1, resumeElapsed / remainingDuration);
      const eased = 1 - Math.pow(1 - progress, 1.45);
      return introCount + Math.ceil((sentence.length - introCount) * eased);
    }

    function applyPaletteData(palette) {
      document.documentElement.style.setProperty("--paper", palette.paper);
      document.documentElement.style.setProperty("--type", palette.type);
      document.documentElement.style.setProperty("--solid", palette.solid);
      document.documentElement.style.setProperty("--cursor", palette.cursor || palette.solid);
      document.documentElement.style.setProperty("--selection", palette.selection || palette.cursor || palette.solid);
    }

    window.__niklasRenderExportFrame = function renderExportFrame(version, exportFrame) {
      const fps = 24;
      const milliseconds = exportFrame / fps * 1000;
      const cycleStart = pause + duration + introHold + 500;
      const cycleDuration = 1000;
      const paletteData = Array.from(palettes).map((palette) => ({ ...palette.dataset }));
      const startOffsets = [4, 0, 1];
      let activePalette = paletteData[startOffsets[version] % paletteData.length];

      cancelAnimationFrame(frame);
      editable = false;
      visibleText.contentEditable = "false";
      visibleText.blur();

      if (milliseconds >= cycleStart && paletteData.length) {
        const index = (Math.floor((milliseconds - cycleStart) / cycleDuration) + startOffsets[version]) % paletteData.length;
        activePalette = paletteData[index];
      }

      applyPaletteData(activePalette);

      const count = Math.min(sentence.length, countAtElapsed(milliseconds));
      const visibleLines = formatText(count);
      const text = visibleLines.join("\n");
      const done = count >= sentence.length;

      renderTypedLines(visibleLines, done);
      cursor.classList.toggle("done", done);
      currentScale = fitScale(text);
      textWrap.style.transform = `scale(${currentScale})`;
    };

    function renderFullText() {
      const text = lines.join("\n");

      renderTypedLines(lines, true);
      cursor.classList.add("done");
      currentScale = fitScale(text);
      textWrap.style.transform = `scale(${currentScale})`;
      enableEditing();
    }

    function enableEditing() {
      if (editable || matchMedia("(max-width: 900px)").matches) {
        return;
      }

      editable = true;
      visibleText.contentEditable = "plaintext-only";
      visibleText.setAttribute("spellcheck", "false");
      visibleText.setAttribute("aria-label", "Editable introduction text. Type to edit.");
      visibleText.focus({ preventScroll: true });
      moveCaretToEnd();
      requestAnimationFrame(updateCustomCaret);
    }

    function moveCaretToEnd() {
      const range = document.createRange();
      const selection = window.getSelection();
      const lastText = visibleText.querySelector(".type-line:last-child .line-text")?.firstChild;

      if (lastText) {
        range.setStart(lastText, lastText.textContent.length);
        range.collapse(true);
      } else {
        range.selectNodeContents(visibleText);
        range.collapse(false);
      }

      selection.removeAllRanges();
      selection.addRange(range);
    }

    function getEditableLines() {
      const lineElements = visibleText.querySelectorAll(".line-text");

      if (lineElements.length) {
        return Array.from(lineElements).map((line) => line.textContent);
      }

      return (visibleText.innerText || visibleText.textContent || "").split("\n");
    }

    function getEditableText() {
      return getEditableLines().join("\n");
    }

    function pointToTextOffset(node, offset) {
      const lineElements = Array.from(visibleText.querySelectorAll(".line-text"));
      let total = 0;

      for (let index = 0; index < lineElements.length; index += 1) {
        const line = lineElements[index];
        const textNode = line.firstChild;
        const textLength = line.textContent.length;

        if (node === line) {
          return total + Math.min(offset, textLength);
        }

        if (textNode && node === textNode) {
          return total + Math.min(offset, textLength);
        }

        if (line.contains(node)) {
          return total + textLength;
        }

        total += textLength + 1;
      }

      return Math.max(0, total - 1);
    }

    function getSelectionOffsets() {
      const selection = window.getSelection();

      if (!selection || selection.rangeCount === 0 || !visibleText.contains(selection.anchorNode)) {
        const end = getEditableText().length;
        return { start: end, end };
      }

      const anchor = pointToTextOffset(selection.anchorNode, selection.anchorOffset);
      const focus = pointToTextOffset(selection.focusNode, selection.focusOffset);

      return {
        start: Math.min(anchor, focus),
        end: Math.max(anchor, focus)
      };
    }

    function setCaretOffset(offset) {
      const selection = window.getSelection();
      const range = document.createRange();
      const lineElements = Array.from(visibleText.querySelectorAll(".line-text"));
      let remaining = Math.max(0, offset);

      for (let index = 0; index < lineElements.length; index += 1) {
        const line = lineElements[index];
        const textNode = line.firstChild || line.appendChild(document.createTextNode(""));
        const textLength = textNode.textContent.length;

        if (remaining <= textLength || index === lineElements.length - 1) {
          range.setStart(textNode, Math.min(remaining, textLength));
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
          return;
        }

        remaining -= textLength + 1;
      }

      range.selectNodeContents(visibleText);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function renderEditableText(text, caretOffset = null) {
      const editableLines = text.split("\n");

      renderTypedLines(editableLines.length ? editableLines : [""]);
      currentScale = fitScale(text || " ");
      textWrap.style.transform = `scale(${currentScale})`;

      if (caretOffset !== null) {
        setCaretOffset(caretOffset);
      }

      requestAnimationFrame(updateCustomCaret);
    }

    function replaceSelectedText(replacement) {
      const text = getEditableText();
      const selectionOffsets = getSelectionOffsets();
      const nextText = text.slice(0, selectionOffsets.start) + replacement + text.slice(selectionOffsets.end);
      const nextOffset = selectionOffsets.start + replacement.length;

      renderEditableText(nextText, nextOffset);
    }

    function handleEditableBeforeInput(event) {
      if (!editable) {
        return;
      }

      if (event.inputType === "insertParagraph" || event.inputType === "insertLineBreak") {
        event.preventDefault();
        replaceSelectedText("\n");
        return;
      }

      if (event.inputType === "insertText") {
        event.preventDefault();
        replaceSelectedText(event.data || "");
        return;
      }

      if (event.inputType === "insertFromPaste") {
        event.preventDefault();
        replaceSelectedText((event.clipboardData || window.clipboardData).getData("text/plain"));
        return;
      }

      if (event.inputType === "deleteContentBackward" || event.inputType === "deleteContentForward") {
        const text = getEditableText();
        const selectionOffsets = getSelectionOffsets();
        let start = selectionOffsets.start;
        let end = selectionOffsets.end;

        event.preventDefault();

        if (start === end && event.inputType === "deleteContentBackward" && start > 0) {
          start -= 1;
        } else if (start === end && event.inputType === "deleteContentForward" && end < text.length) {
          end += 1;
        }

        renderEditableText(text.slice(0, start) + text.slice(end), start);
      }
    }

    function handleEditableInput() {
      if (!editable) {
        return;
      }

      const text = visibleText.innerText || visibleText.textContent || "";
      renderEditableText(text.replace(/\n+$/, ""), getSelectionOffsets().end);
    }

    function updateEditableScale() {
      currentScale = fitScale(getEditableText() || " ");
      textWrap.style.transform = `scale(${currentScale})`;
      requestAnimationFrame(updateCustomCaret);
    }

    function updateCustomCaret() {
      if (!editable) {
        return;
      }

      const selection = window.getSelection();

      if (!selection || selection.rangeCount === 0 || !visibleText.contains(selection.anchorNode)) {
        cursor.classList.remove("done");
        return;
      }

      const range = selection.getRangeAt(0).cloneRange();
      range.collapse(false);

      let rect = range.getBoundingClientRect();

      if (!rect || (rect.width === 0 && rect.height === 0)) {
        const marker = document.createElement("span");
        marker.textContent = "\u200b";
        range.insertNode(marker);
        rect = marker.getBoundingClientRect();
        marker.remove();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      const hostRect = document.querySelector(".sentence").getBoundingClientRect();
      cursor.style.setProperty("--caret-x", `${(rect.left - hostRect.left) / currentScale}px`);
      cursor.style.setProperty("--caret-y", `${(rect.top - hostRect.top) / currentScale}px`);
      cursor.classList.add("done");
    }

    function restart() {
      start = performance.now();
      editable = false;
      visibleText.contentEditable = "false";
      visibleText.removeAttribute("spellcheck");
      visibleText.removeAttribute("aria-label");
      document.body.classList.remove("is-peeking");
      clearTimeout(peekTimer);
      if (!skipProjectPeek) {
        scheduleProjectPeek();
      }
      cursor.classList.remove("done");
      cancelAnimationFrame(frame);

      if (debugNoAnimation || startFinished) {
        startFinished = false;
        renderFullText();
        return;
      }

      frame = requestAnimationFrame(render);
    }

    function scheduleProjectPeek(delay = 10000) {
      clearTimeout(peekTimer);
      peekTimer = window.setTimeout(() => {
        if (navLocked || exportMode) {
          return;
        }

        document.body.classList.remove("is-peeking");
        requestAnimationFrame(() => {
          document.body.classList.add("is-peeking");
        });
        scheduleProjectPeek(9000);
      }, delay);
    }

    function canRestartFromClick() {
      const desktopPointer = matchMedia("(hover: hover) and (pointer: fine)").matches;
      const hasTouch = navigator.maxTouchPoints > 0 || "ontouchstart" in window;
      const recentTouch = Date.now() - lastTouchAt < 900;
      return desktopPointer && !hasTouch && !recentTouch;
    }

    stage.addEventListener("click", () => {
      if (!editable && canRestartFromClick()) {
        restart();
      }
    });
    visibleText.addEventListener("beforeinput", handleEditableBeforeInput);
    visibleText.addEventListener("input", handleEditableInput);
    visibleText.addEventListener("keyup", updateCustomCaret);
    visibleText.addEventListener("mouseup", updateCustomCaret);
    document.addEventListener("selectionchange", updateCustomCaret);
    window.addEventListener("resize", restart);
    palettes.forEach((palette) => {
      const applyPalette = () => {
        applyPaletteData(palette.dataset);
      };

      palette.addEventListener("pointerenter", applyPalette);
      palette.addEventListener("focus", applyPalette);
      palette.addEventListener("click", applyPalette);
    });

    let navLocked = false;
    let touchStartY = null;
    const PROJECTS_PATH = "/project/";

    function goToProjects() {
      if (navLocked) {
        return;
      }

      navLocked = true;
      document.body.classList.remove("is-peeking");
      clearTimeout(peekTimer);
      window.location.href = PROJECTS_PATH;
    }

    window.addEventListener("wheel", (event) => {
      if (event.ctrlKey || Math.abs(event.deltaY) < 24 || event.deltaY <= Math.abs(event.deltaX)) {
        return;
      }

      if (event.deltaY > 0) {
        event.preventDefault();
        goToProjects();
      }
    }, { passive: false });

    window.addEventListener("touchstart", (event) => {
      lastTouchAt = Date.now();
      touchStartY = event.touches[0]?.clientY ?? null;
    }, { passive: true });

    window.addEventListener("touchmove", (event) => {
      if (touchStartY == null) {
        return;
      }

      const y = event.touches[0]?.clientY ?? touchStartY;
      const deltaY = touchStartY - y;

      if (deltaY > 44) {
        event.preventDefault();
        goToProjects();
      }
    }, { passive: false });

    restart();
  </script>
</body>
