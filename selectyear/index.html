<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Be There On Time Please</title>
  <link rel="icon" href="../assets/img/i-023.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Inter variable font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add('is-embed');
    }
  </script>
  <style>
    html, body { margin:0; padding:0; background:#fff; height:100%; }
    /* Avoid iOS bounce showing white gaps around canvas */
    html, body { overscroll-behavior: none; touch-action: manipulation; }
    canvas { display:block; }

    html.is-embed .global-site-header {
      display: none !important;
    }

    .center-year{
      position:fixed;
      left:50%;
      top:calc(50% + env(safe-area-inset-top));
      transform:translate(-50%,-50%);
      line-height:1.15;
      pointer-events:none;
      font-family:'Inter', sans-serif;
      font-optical-sizing:auto;
      text-rendering: optimizeLegibility;
      font-weight: 400;
      font-size: 20px;
      color:#000;
      white-space: nowrap;
      background: transparent;
      padding: 0;
      border-radius: 0;
      max-width: calc(100vw - 24px); /* keep pills inside on tiny screens */
    }

    .center-year .seg { padding:0 0; border-radius:2px; }
    .center-year .seg.active {
      background:#000; color:#fff; padding:2px 6px; border-radius:2px;
    }

    .center-year.all-complete{
      background:#000;
      color:#fff;
      padding: 4px 8px;
      border-radius: 4px;
      /* subtle lift for readability on photos/bright screens */
      box-shadow: 0 2px 16px rgba(0,0,0,.15);
    }
    .center-year.all-complete .seg{
      background: transparent !important;
      color: #fff !important;
      padding: 0 !important;
    }

    /* Mobile fine-tune */
    @media (max-width: 768px){
      .center-year{
        line-height:1.1;
      }
      .center-year .seg.active { padding:2px 6px; border-radius:3px; }
      .center-year.all-complete{ padding:6px 10px; border-radius:6px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.2/p5.min.js"></script>
  <script defer src="/ga-init.js"></script>
  <script defer src="/analytics.js"></script>
  <link rel="stylesheet" href="/global-nav.css">
  <script defer src="/global-nav.js"></script>
</head>
<body>
<div class="center-year" id="centerYear">1975</div>

<script>
  // ===== RESPONSIVE SETTINGS (recomputed on resize) =====
  let FONT_WEIGHT = 400;
  let ALL_TEXT_SIZE_PX = 20;

  let SCROLL_SENSITIVITY = 0.0085;
  let MAX_VELOCITY = 0.8;
  let DAMPING = 0.92;
  let LERP_TO_TARGET = 0.21;
  let SNAP_IDLE_MS = 160;
  let SNAP_STRENGTH = 0.25;
  let SPACING_FACTOR = 0.05;

  // Gap range for non-center rows
  let MIN_GAP_PX = 50;
  let MAX_GAP_PX = 500;
  let FADE_RANGE_ROWS = 5;

  const MONTHS    = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const WEEKDAYS  = ['MON','TUE','WED','THU','FRI','SAT','SUN']; // Monday-first rendering

  // Data
  let items = [];   // unified sequence: years → months → days → weekdays → hours → minutes

  // segment boundaries (inclusive ends)
  let idxYearStart=0, idxYearEnd=0;
  let idxMonthStart=0, idxMonthEnd=0;
  let idxDayStart=0, idxDayEnd=0;
  let idxWkStart=0, idxWkEnd=0;
  let idxHourStart=0, idxHourEnd=0;
  let idxMinStart=0, idxMinEnd=0;

  let idx1975 = 0;
  let idx2026 = 0;

  // State
  let offset = 0, targetOffset = 0, velocity = 0;
  let dragging = false, lastY = 0, lastInputMs = 0;
  const $center = document.getElementById('centerYear');

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function monFirstWeekdayIndex(date){ return (date.getDay() + 6) % 7; } // JS 0=Sun -> 6, so MON=0

  function isMobile(){ return window.innerWidth <= 768; }

  function recalcResponsive(){
    const minSide = Math.min(window.innerWidth, window.innerHeight);
    const mobile = isMobile();

    // Type size scales with viewport but stays readable
    ALL_TEXT_SIZE_PX = Math.round(clamp(minSide * (mobile ? 0.05 : 0.04), 14, mobile ? 28 : 32));

    // Spacing between rows – slightly denser on mobile
    SPACING_FACTOR   = mobile ? 0.065 : 0.05;

    // Gaps between letters for off-center rows – shrink on small screens
    MIN_GAP_PX = Math.round(clamp(minSide * 0.035, 12, 40));
    MAX_GAP_PX = Math.round(clamp(minSide * 0.45, 120, mobile ? 120 : 160));

    // Faster, more immediate scroll response
    SCROLL_SENSITIVITY = mobile ? 0.006 : 0.0085;
    MAX_VELOCITY       = mobile ? 0.65   : 0.8;
    DAMPING            = mobile ? 0.93   : 0.92;

    // Apply to overlay
    $center.style.fontVariationSettings = `"wght" ${FONT_WEIGHT}`;
    $center.style.fontWeight = FONT_WEIGHT;
    $center.style.fontSize = ALL_TEXT_SIZE_PX + 'px';
  }

  function buildSequence(){
    items = [];
    const now = new Date();
    const currentMonth = now.getMonth();        // 0..11
    const currentDay   = now.getDate();         // 1..31
    const currentHour  = now.getHours();        // 0..23
    const currentMin   = now.getMinutes();      // 0..59
    const curWkIdx     = monFirstWeekdayIndex(now);

    // YEARS
    idxYearStart = items.length;
    for(let y=1975; y<=2026; y++){ items.push(String(y)); }
    idxYearEnd = items.length - 1;

    // MONTHS (up to current month)
    idxMonthStart = items.length;
    for(let m=0; m<=currentMonth; m++){ items.push(MONTHS[m]); }
    idxMonthEnd = items.length - 1;

    // DAYS (01..today)
    idxDayStart = items.length;
    for(let d=1; d<=currentDay; d++){ items.push(pad2(d)); }
    idxDayEnd = items.length - 1;

    // WEEKDAYS (MON..today’s weekday)
    idxWkStart = items.length;
    for(let w=0; w<=curWkIdx; w++){ items.push(WEEKDAYS[w]); }
    idxWkEnd = items.length - 1;

    // HOURS (00..current hour)
    idxHourStart = items.length;
    for (let h = 0; h <= currentHour; h++) { items.push(pad2(h)); }
    idxHourEnd = items.length - 1;

    // MINUTES (00..current minute) – keep every minute so time is exact
    idxMinStart = items.length;
    for (let mm = 0; mm <= currentMin; mm++) { items.push(pad2(mm)); }
    idxMinEnd = items.length - 1;

    idx1975 = items.indexOf('1975');
    idx2026 = items.indexOf('2026');
  }

  function setup() {
    createCanvas(windowWidth, windowHeight);
    // Make the canvas crisp on high-DPI screens
    pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
    textAlign(CENTER, CENTER);
    textFont('Inter');
    frameRate(60);

    buildSequence();
    recalcResponsive();
  }

  function draw() {
    background(255);
    const spacing = Math.min(110, height * SPACING_FACTOR);

    // Physics
    targetOffset += velocity;
    velocity *= DAMPING;
    velocity = constrain(velocity, -MAX_VELOCITY, MAX_VELOCITY);

    const nowMs = millis();
    const idle = nowMs - lastInputMs > SNAP_IDLE_MS && !dragging && Math.abs(velocity) < 0.01;
    if (idle) targetOffset = lerp(targetOffset, Math.round(targetOffset), SNAP_STRENGTH);

    offset = lerp(offset, targetOffset, LERP_TO_TARGET);

    // Bounds
    const maxUp = idx1975;
    const maxDown = items.length - 1 - idx1975;
    offset       = constrain(offset,       -maxUp - 0.01, maxDown + 0.01);
    targetOffset = constrain(targetOffset, -maxUp,         maxDown);

    // Visible rows around center
    const visible = Math.ceil(height / spacing) + 6;
    const centerRow = Math.floor(offset);

    // Draw non-center rows (with letter gaps)
    fill(0);
    textSize(ALL_TEXT_SIZE_PX);
    for (let r = centerRow - visible; r <= centerRow + visible; r++) {
      const i = idx1975 + r;
      if (i < 0 || i >= items.length) continue;
      const rel = r - offset;
      const y = height / 2 + rel * spacing;
      if (Math.abs(rel) < 0.5) continue;

      const d = Math.abs(rel);
      const gap = lerp(MIN_GAP_PX, MAX_GAP_PX, clamp(d / FADE_RANGE_ROWS, 0, 1));

      drawWithGap(items[i], width/2, y, gap);
    }

    // Determine progressive locked display + active segment
    const nearest = Math.round(offset);
    const globalIndex = idx1975 + nearest; // absolute index in items

    const nowLocal = new Date();
    const curMonth = nowLocal.getMonth();
    const curDay   = nowLocal.getDate();
    const curHour  = nowLocal.getHours();
    const curMin   = nowLocal.getMinutes();
    const curWkIdx = monFirstWeekdayIndex(nowLocal);

    // Which segment is active right now?
    let active = 'minute';
    if (globalIndex <= idx2026) active = 'year';
    else if (globalIndex <= idxMonthEnd) active = 'month';
    else if (globalIndex <= idxDayEnd) active = 'day';
    else if (globalIndex <= idxWkEnd) active = 'weekday';
    else if (globalIndex <= idxHourEnd) active = 'hour';
    else if (globalIndex <= idxMinEnd) active = 'minute';

    // Progressive values
    let Y=null, M=null, D=null, W=null, H=null, Min=null;

    // YEAR
    if (active === 'year') { Y = items[globalIndex]; } else { Y = '2026'; }

    // MONTH
    if (globalIndex < idxMonthStart) { M = null; }
    else if (active === 'month') { M = items[globalIndex]; }
    else { M = MONTHS[curMonth]; }

    // DAY
    if (globalIndex < idxDayStart) { D = null; }
    else if (active === 'day') { D = items[globalIndex]; }
    else { D = pad2(curDay); }

    // WEEKDAY
    if (globalIndex < idxWkStart) { W = null; }
    else if (active === 'weekday') { W = items[globalIndex]; }
    else { W = WEEKDAYS[curWkIdx]; }

    // HOUR
    if (globalIndex < idxHourStart) { H = null; }
    else if (active === 'hour') { H = items[globalIndex]; }
    else { H = pad2(curHour); }

    // MINUTE
    if (globalIndex < idxMinStart) { Min = null; }
    else if (active === 'minute') { Min = items[globalIndex]; }
    else { Min = pad2(curMin); }

    // Build overlay with only the ACTIVE segment highlighted (until complete)
    $center.innerHTML = buildOverlayHTML({Y,M,D,W,H,Min, active});
    $center.style.opacity = '1';

    // Completed state: whole pill flips black/white
    const allComplete = globalIndex >= idxMinEnd;
    $center.classList.toggle('all-complete', allComplete);
  }

  function buildOverlayHTML({Y,M,D,W,H,Min, active}) {
    const parts = [];

    if (Y) parts.push(segHTML(Y, active==='year'));
    if (M) parts.push(segHTML(M, active==='month'));
    if (D) parts.push(segHTML(D, active==='day'));
    if (W) parts.push(segHTML(W, active==='weekday'));

    if (H && Min !== null) {
      const hourHTML = segHTML(H, active==='hour');
      const minHTML  = segHTML(Min, active==='minute');
      parts.push(`${hourHTML}<span class="seg">:</span>${minHTML}`);
    } else if (H && Min === null) {
      parts.push(segHTML(H, active==='hour'));
    }

    return parts.join(' ');
  }

  function segHTML(text, isActive){
    const cls = 'seg' + (isActive ? ' active' : '');
    return `<span class="${cls}">${text}</span>`;
  }

  function drawWithGap(txt, x, y, gap) {
    const chars = txt.split('');
    let totalWidth = chars.reduce((acc, ch) => acc + textWidth(ch), 0) + gap * (chars.length - 1);
    let cx = x - totalWidth / 2;
    for (let ch of chars) {
      text(ch, cx + textWidth(ch)/2, y);
      cx += textWidth(ch) + gap;
    }
  }

  // Input
  function mouseWheel(e) {
    velocity += e.delta * SCROLL_SENSITIVITY;
    velocity = constrain(velocity, -MAX_VELOCITY, MAX_VELOCITY);
    lastInputMs = millis();
    return false;
  }
  function mousePressed(){ dragging = true; lastY = mouseY; lastInputMs = millis(); }
  function mouseDragged(){
    if (!dragging) return;
    const unit = Math.min(110, height * SPACING_FACTOR);
    const dy = mouseY - lastY; lastY = mouseY;
    targetOffset -= dy / unit;
    velocity = constrain(-dy / unit, -MAX_VELOCITY, MAX_VELOCITY);
    lastInputMs = millis();
  }
  function mouseReleased(){ dragging = false; }

  // Touch
  function touchStarted(){ lastY = (touches[0]?.y ?? mouseY); lastInputMs = millis(); }
  function touchMoved(){
    const t = touches[0]; if (!t) return false;
    const unit = Math.min(110, height * SPACING_FACTOR);
    const dy = t.y - lastY; lastY = t.y;
    targetOffset -= dy / unit;
    velocity = constrain(-dy / unit, -MAX_VELOCITY, MAX_VELOCITY);
    lastInputMs = millis();
    return false;
  }
  function touchEnded(){ dragging = false; }

  function windowResized(){
    resizeCanvas(windowWidth, windowHeight);
    recalcResponsive();
  }

  // Keep minutes fresh
  setInterval(() => {
    const beforeLen = items.length;
    const wasAtEnd = (Math.round(targetOffset) + idx1975) === (beforeLen - 1);
    buildSequence();
    const afterLen = items.length;
    const shift = afterLen - beforeLen; // usually +1 per minute
    targetOffset += shift;
    offset += shift;
    if (wasAtEnd) {
      targetOffset = Math.max(targetOffset, afterLen - 1 - idx1975);
    }
  }, 5000);
</script>
</body>
</html>
