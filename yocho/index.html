<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Editorial Design - Ekko</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
/* === GLOBAL RESET === */
* { margin: 0; padding: 0; box-sizing: border-box; }

html { background-color: #f6f6f6; }
body {
  background: #fcfcfc;
  font-family: 'Inter', sans-serif;
  position: relative;
  overflow-x: hidden;
  min-height: 100vh;
}

/* === BACK BUTTON (desktop) === */
.back-button {
  position: fixed; top: 20px; left: 20px; z-index: 999;
  font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400;
  color: #000; background: #fff; text-decoration: none;
  padding: 8px 14px; border: none; border-radius: 4px;
  mix-blend-mode: difference; transition: background .2s, color .2s; cursor: pointer;
}
.back-button .arrow { position: relative; top: -1.5px; }

/* === DESKTOP LAYOUT === */
.hero { width: 100%; }
.hero-inner {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; width: 100vw;
}
.hero-inner img, .hero-inner video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}

.hero-image { width: 100vw; height: 100vh; overflow: hidden; }
.hero-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* === MARQUEE FIXED BOTTOM === */
.marquee {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  background: #000;
  color: #fff;
  font-size: 2rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  z-index: 1000;
  padding: 10px 0;
}

.marquee__inner {
  display: flex;
  width: max-content;
  animation: scroll 35s linear infinite;
}

.marquee__inner span {
  margin-right: 2rem;
}

/* smooth loop */
@keyframes scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* === MOBILE LAYOUT === */
@media (max-width: 768px) {
  .back-button { display: none; }

  .hero {
    width: 100%;
    height: 100vh;
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x mandatory;
    gap: 0;
  }
  @supports (height: 100svh) {
    .hero { height: 100svh; }
  }

  .hero-inner { display: contents; }

  .hero-inner img,
  .hero-inner video,
  .hero-image img {
    height: 100%;
    width: auto;
    object-fit: contain;
    display: block;
    background: #000;
    flex: 0 0 auto;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  .hero-inner::-webkit-scrollbar,
  .hero::-webkit-scrollbar { display: none; }
  .hero-inner, .hero { scrollbar-width: none; }

  .hero-image { display: contents; height: auto; }

  .marquee { font-size: 1.4rem; }
}
</style>
  <script defer src="/ga-init.js"></script>
  <script defer src="/analytics.js"></script>
</head>
<body>

<a href="../project/" class="back-button"><span class="arrow">←</span> Back</a>

<div class="hero">
  <div class="hero-inner">
    <img src="../Images/yocho2.png" alt="Mountain Stage Background" loading="lazy" decoding="async">
    <img src="../Images/yocho-profile.png" alt="Tour de France Postcard" loading="lazy" decoding="async">
    <img src="../Images/yochopic1.png" alt="Tour de France Postcard" loading="lazy" decoding="async">
    <img src="../Images/yocho-place.png" alt="Tour de France Postcard" loading="lazy" decoding="async">

  </div>
  <div class="hero-image">
    <img src="../Images/yocho_frontcover.png" alt="Hero Image" loading="lazy" decoding="async">
  </div>
</div>

</body>
</html>
