<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory of a Flower</title>
<style>
  body {
    margin: 0;
    background: #fafafa;
    overflow-x: hidden;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #bgCanvas { z-index: 0; }
  #titleCanvas { z-index: 1; pointer-events: none; }

  #scroll-indicator {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: serif;
    font-size: 18px;
    color: rgba(0,0,0,0.5);
    animation: bounce 1.5s infinite;
    z-index: 2;
    transition: opacity 0.6s;
  }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-10px); }
  }
  #scroll-indicator.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<canvas id="titleCanvas"></canvas>
<div id="scroll-indicator">scroll</div>

<script>
const bgCanvas = document.getElementById("bgCanvas");
const bgCtx = bgCanvas.getContext("2d");
const titleCanvas = document.getElementById("titleCanvas");
const titleCtx = titleCanvas.getContext("2d");

// --- timings / layout control (only tweak here) ---
const CONFIG = {
  revealZoneMult: 2,     // how many viewheights to reveal the garden
  morphStartFrac: 0.10,  // fraction into reveal where the morph begins
  morphLength: 4000      // px of scroll for the morph itself
};

let flowers = [];
let time = 0;

// Derived scroll landmarks (recomputed on resize)
let REVEAL_ZONE = 0;
let MORPH_START = 0;
let MORPH_END = 0;

function recomputeScrollLandmarks() {
  REVEAL_ZONE = window.innerHeight * CONFIG.revealZoneMult;
  MORPH_START = REVEAL_ZONE * CONFIG.morphStartFrac;
  MORPH_END   = MORPH_START + CONFIG.morphLength;
}

function resizeCanvas() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  titleCanvas.width = window.innerWidth;
  titleCanvas.height = window.innerHeight;
  recomputeScrollLandmarks();
  generateFlowers();
  adjustBodyHeight();
}
window.addEventListener("resize", resizeCanvas);

function adjustBodyHeight() {
  // Hard stop exactly when morph completes (+ one viewport so it can rest there)
  const totalScrollable = Math.max(REVEAL_ZONE, MORPH_END);
  document.body.style.height = (totalScrollable + window.innerHeight) + "px";
}

function noise(t,seed=0){return Math.sin(t*2.3+seed*10)+Math.sin(t*0.7+1.5+seed)*0.5;}

function makeFlower(cx,cy,R,petals,layersCount,seedOffset=0){
  let layers=[];
  for(let layer=0;layer<layersCount;layer++){
    let path=[];
    for(let a=0;a<=Math.PI*2;a+=0.05){
      let r=R*(0.65+0.35*Math.cos(petals*a));
      r+=noise(a*2+seedOffset,layer)*(10+layer*3);
      path.push([cx+r*Math.cos(a),cy+r*Math.sin(a),a,layer]);
    }
    layers.push(path);
  }
  return layers;
}

function generateFlowers(){
  flowers=[];
  const W=bgCanvas.width,H=bgCanvas.height;
  for(let i=0;i<25;i++){
    let cx=Math.random()*W,cy=Math.random()*H;
    let R=40+Math.random()*Math.min(W,H)/4;
    let petals=4+Math.floor(Math.random()*6);
    let layersCount=3+Math.floor(Math.random()*3);
    let depth=0.3+Math.random()*0.9;
    flowers.push({layers:makeFlower(cx,cy,R,petals,layersCount,i*0.77),depth});
  }
}

function drawMemoryGarden(cutY,parallaxY){
  const W=bgCanvas.width,H=bgCanvas.height;
  bgCtx.clearRect(0,0,W,H);
  flowers.forEach((flower,fIndex)=>{
    let {layers,depth}=flower;
    let offsetY=parallaxY*depth*0.5;
    let offsetX=Math.sin(fIndex)*parallaxY*0.05*depth;
    layers.forEach((layer,lIndex)=>{
      bgCtx.beginPath();
      bgCtx.strokeStyle=`rgba(0,0,0,${0.05+0.03*lIndex})`;
      let started=false;
      for(let [bx,by,a,li] of layer){
        if(by>cutY) continue;
        let jitter=Math.sin(time*0.002+a*5+li*10)*2;
        let x=bx+Math.cos(a)*jitter+offsetX;
        let y=by+Math.sin(a)*jitter+offsetY;
        if(Math.random()<0.01){started=false;continue;}
        if(!started){bgCtx.moveTo(x,y);started=true;}else{bgCtx.lineTo(x,y);}
      }
      bgCtx.stroke();
    });
  });
}

function getCutAndParallax(){
  const H=bgCanvas.height;
  const rawScroll = window.scrollY;
  // Clamp all rendering past the morph end so visuals don't "creep"
  const scrollY = Math.min(rawScroll, MORPH_END);

  let cutY, parallax = 0;

  if(scrollY < REVEAL_ZONE){
    cutY = H * (scrollY / REVEAL_ZONE);
    parallax = scrollY;
  }else{
    cutY = H;
    parallax = scrollY;
  }

  return {cutY,parallax,scrollY};
}

/* === title morph === */
const fromText="Memory of a Flower";
const toText="Never Forget Love";
function morphText(p){
  const from=fromText.split(""),to=toText.split("");
  const maxLen=Math.max(from.length,to.length);
  const changeCount=Math.floor(p*maxLen);
  let result=[];
  for(let i=0;i<maxLen;i++){
    if(i<changeCount && i<to.length) result.push(to[i]);
    else if(i<from.length && i>=changeCount) result.push(from[i]);
    else if(i<to.length) result.push(to[i]);
  }
  return result.join("");
}

function drawTitle(scrollY){
  titleCtx.clearRect(0,0,titleCanvas.width,titleCanvas.height);

  let progress = 0;
  if(scrollY > MORPH_START) {
    progress = Math.min((scrollY - MORPH_START) / (MORPH_END - MORPH_START), 1);
  }

  const txt = morphText(progress);
  const letters=txt.split("");
  titleCtx.font="bold 100px serif";
  titleCtx.textBaseline="middle";
  titleCtx.textAlign="left";
  const kernLetter = {
    "w": -6, "v": -6, "y": -8, "t": -6,
    "W": -30, "V": -12, "Y": -8, "T": -6,
    "g": -4, "r": -2, " ": -2
  };
  const kernPair = {
    "wo": -16, "wa": -14,
    "ow": -7, "aw": -10,
    "Fo": -10, "Fl": 0,
    "ov": -7, "Ne": -5,
    "ev": -4, "Me": -5,
    "mo": -4, "or": -4,
    "lo": -4, "tF": 30,
    "et": -2, "ry": 1,
    "of": -2, "er": -1.5
  };

  function measure(arr){
    let tot=0;
    for(let i=0;i<arr.length;i++){
      const ch=arr[i],next=arr[i+1]||"";
      const w=titleCtx.measureText(ch).width;
      const adj=(kernLetter[ch]||0)+(kernPair[ch+next]||0);
      tot+=w+adj;
    }
    return tot;
  }
  const total=measure(letters);
  let x=(titleCanvas.width-total)/2,y=titleCanvas.height/2;

  for(let i=0;i<letters.length;i++){
    const ch=letters[i],next=letters[i+1]||"";
    for(let j=0;j<5;j++){titleCtx.strokeStyle="rgba(0,0,0,0.15)";titleCtx.strokeText(ch,x,y);}
    const w=titleCtx.measureText(ch).width;
    x+=w+(kernLetter[ch]||0)+(kernPair[ch+next]||0);
  }
}

function animate(){
  time++;
  const {cutY,parallax,scrollY}=getCutAndParallax();
  drawMemoryGarden(cutY,parallax);
  drawTitle(scrollY);

  // Hide the indicator once we've moved a bit
  document.getElementById("scroll-indicator").classList.toggle("hidden",window.scrollY>50);

  requestAnimationFrame(animate);
}

// Prevent overscrolling past the morph end on momentum devices (iOS, touchpads)
window.addEventListener('scroll', () => {
  if (window.scrollY > MORPH_END) {
    window.scrollTo(0, MORPH_END);
  }
}, { passive: true });

resizeCanvas();
animate();
</script>
</body>
</html>
