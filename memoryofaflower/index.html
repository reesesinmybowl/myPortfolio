<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory of a Flower</title>
<style>
  /* Ensure the browser doesn't add its own smooth scrolling */
  html, body { scroll-behavior: auto; }

  body {
    margin: 0;
    background: #fafafa;
    overflow-x: hidden;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #bgCanvas { z-index: 0; }
  #titleCanvas { z-index: 1; pointer-events: none; }

  #scroll-indicator {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-family: serif;
    font-size: 18px;
    color: rgba(0,0,0,0.5);
    animation: bounce 1.5s infinite;
    z-index: 2;
    transition: opacity 0.6s;
  }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%     { transform: translateX(-50%) translateY(-10px); }
  }
  #scroll-indicator.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<canvas id="titleCanvas"></canvas>
<div id="scroll-indicator">scroll</div>

<script>
const bgCanvas = document.getElementById("bgCanvas");
const bgCtx = bgCanvas.getContext("2d");
const titleCanvas = document.getElementById("titleCanvas");
const titleCtx = titleCanvas.getContext("2d");

let flowers = [];
let time = 0;

function resizeCanvas() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  titleCanvas.width = window.innerWidth;
  titleCanvas.height = window.innerHeight;
  generateFlowers();
  adjustBodyHeight();
}
window.addEventListener("resize", resizeCanvas);

function adjustBodyHeight() {
  const revealZone = window.innerHeight * 2;
  const morphLength = 150;   // quick morph
  const fallZone    = 800;   // extra scroll space only (does not alter speed)
  document.body.style.height =
    (revealZone + morphLength + fallZone + window.innerHeight) + "px";
}

/* ===== FLOWERS ===== */
function noise(t,seed=0){return Math.sin(t*2.3+seed*10)+Math.sin(t*0.7+1.5+seed)*0.5;}

function makeFlower(cx,cy,R,petals,layersCount,seedOffset=0){
  let layers=[];
  // Precompute a reasonably fine path; we'll downsample dynamically when drawing
  for(let layer=0;layer<layersCount;layer++){
    let path=[];
    for(let a=0;a<=Math.PI*2;a+=0.05){
      let r=R*(0.65+0.35*Math.cos(petals*a));
      r+=noise(a*2+seedOffset,layer)*(10+layer*3);
      path.push([cx+r*Math.cos(a),cy+r*Math.sin(a),a,layer]);
    }
    layers.push(path);
  }
  return layers;
}

function generateFlowers(){
  flowers=[];
  const W=bgCanvas.width,H=bgCanvas.height;
  const count = 25; // total geometry stays the same; draw-time decimation keeps FPS stable
  for(let i=0;i<count;i++){
    let cx=Math.random()*W,cy=Math.random()*H;
    let R=40+Math.random()*Math.min(W,H)/4;
    let petals=4+Math.floor(Math.random()*6);
    let layersCount=3+Math.floor(Math.random()*3);
    let depth=0.3+Math.random()*0.9;
    flowers.push({layers:makeFlower(cx,cy,R,petals,layersCount,i*0.77),depth, idx:i});
  }
}

/* ===== DRAW GARDEN with render-budget decimation ===== */
function drawMemoryGarden(cutY,parallaxY){
  const W=bgCanvas.width,H=bgCanvas.height;
  const revealP = Math.min(cutY / H, 1);        // 0 → 1 across reveal
  // As more canvas is revealed, increase skip to keep total drawn vertices ~constant
  // skip = 1 (full detail) at start, grows up to ~4x fewer points near full reveal
  const pointSkip = 1 + Math.floor(revealP * 3);

  bgCtx.clearRect(0,0,W,H);
  bgCtx.lineWidth = 1;

  flowers.forEach((flower)=>{
    const {layers,depth, idx} = flower;
    const offsetY = parallaxY*depth*0.5;
    const offsetX = Math.sin(idx)*parallaxY*0.05*depth;

    layers.forEach((layer,lIndex)=>{
      bgCtx.beginPath();
      bgCtx.strokeStyle = `rgba(0,0,0,${0.05+0.03*lIndex})`;
      let started=false;

      // dynamic decimation: draw every Nth point
      for(let k=0;k<layer.length;k+=pointSkip){
        const item = layer[k];
        const bx=item[0], by=item[1], a=item[2], li=item[3];

        if(by>cutY) { started=false; continue; }

        // light jitter
        const jitter = Math.sin(time*0.002 + a*5 + li*10) * 2;
        const x = bx + Math.cos(a)*jitter + offsetX;
        const y = by + Math.sin(a)*jitter + offsetY;

        if(!started){ bgCtx.moveTo(x,y); started=true; }
        else { bgCtx.lineTo(x,y); }
      }
      bgCtx.stroke();
    });
  });
}

/* ===== SCROLL MAPPING (no scroll speed manipulation) ===== */
function getCutAndParallax(){
  const H=bgCanvas.height;
  const revealZone=window.innerHeight*2;
  const scrollY=window.scrollY;

  let cutY, parallax=0;
  if(scrollY<revealZone){
    cutY=H*(scrollY/revealZone);
    parallax=scrollY;
  }else{
    cutY=H;
    parallax=scrollY;
  }
  // no extra math that changes perceived speed
  return {cutY,parallax,scrollY,revealZone};
}

/* ===== TITLE MORPH (quick & linear) ===== */
const fromText="Memory of a Flower";
const toText="Never Forget Love";

function morphText(p){
  const from=fromText.split(""), to=toText.split("");
  const maxLen=Math.max(from.length,to.length);
  const changeCount=Math.floor(p*maxLen);
  let result=[];
  for(let i=0;i<maxLen;i++){
    if(i<changeCount && i<to.length) result.push(to[i]);
    else if(i<from.length && i>=changeCount) result.push(from[i]);
    else if(i<to.length) result.push(to[i]);
  }
  return result.join("");
}

function drawTitle(scrollY,revealZone){
  titleCtx.clearRect(0,0,titleCanvas.width,titleCanvas.height);

  const morphStart  = revealZone * 0.3;
  const morphLength = 150; // finishes fast

  let progress = 0;
  if(scrollY > morphStart) {
    progress = Math.min((scrollY - morphStart) / morphLength, 1);
  }

  const txt = morphText(progress);
  const letters=txt.split("");
  titleCtx.font="bold 100px serif";
  titleCtx.textBaseline="middle";
  titleCtx.textAlign="left";

  const kernLetter = { "w": -6,"v": -6,"y": -8,"t": -6,"W": -30,"V": -12,"Y": -8,"T": -6,"g": -4,"r": -2," ": -2 };
  const kernPair   = { "wo": -16,"wa": -14,"ow": -7,"aw": -10,"Fo": -10,"Fl": 0,"ov": -7,"Ne": -5,"ev": -4,"Me": -5,"mo": -4,"or": -4,"lo": -4,"tF": 30,"et": -2,"ry": 1,"of": -2,"er": -1.5 };

  function measure(arr){
    let tot=0;
    for(let i=0;i<arr.length;i++){
      const ch=arr[i],next=arr[i+1]||"";
      const w=titleCtx.measureText(ch).width;
      const adj=(kernLetter[ch]||0)+(kernPair[ch+next]||0);
      tot+=w+adj;
    }
    return tot;
  }

  const total=measure(letters);
  let x=(titleCanvas.width-total)/2, y=titleCanvas.height/2;

  titleCtx.shadowColor = "rgba(0,0,0,0.15)";
  titleCtx.shadowBlur  = 6;
  titleCtx.strokeStyle = "rgba(0,0,0,0.35)";

  for(let i=0;i<letters.length;i++){
    const ch=letters[i],next=letters[i+1]||"";
    titleCtx.strokeText(ch,x,y);
    const w=titleCtx.measureText(ch).width;
    x+=w+(kernLetter[ch]||0)+(kernPair[ch+next]||0);
  }
  titleCtx.shadowBlur = 0;
}

/* ===== LOOP ===== */
function animate(){
  time++;
  const {cutY,parallax,scrollY,revealZone}=getCutAndParallax();
  drawMemoryGarden(cutY,parallax);
  drawTitle(scrollY,revealZone);
  document.getElementById("scroll-indicator").classList.toggle("hidden",scrollY>50);
  requestAnimationFrame(animate);
}

resizeCanvas();
animate();
</script>
</body>
</html>
