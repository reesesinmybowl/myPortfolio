<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Editorial Design - Ekko</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background-color: #f6f6f6; }

    body {
      background: #fcfcfc;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      color: #000;
    }

    body::before {
      content: "";
      display: block;
      height: 1px;
      width: 100%;
      background: #fbfbfb;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* === BACK BUTTON (desktop & tablet only) === */
    .back-button {
      position: fixed;
      z-index: 1000;
      top: 16px;
      left: 16px;
      padding: 8px 14px;
      font-size: 16px;
      font-weight: 400;
      color: #000;
      background: #fff;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      mix-blend-mode: difference;
      transition: transform 0.15s ease;
    }
    @supports(padding: max(0px)) {
      .back-button {
        top: max(16px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
      }
    }
    .back-button:active { transform: translateY(1px); }

    /* === LAYOUT === */
    .hero {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 40px 0 20px; /* reduced top margin */
    }

    .hero-inner,
    .stacked,
    .mockup-with-text {
      width: 100%;
      max-width: 1400px;
      padding: 0 10px;
      margin: 0 auto 20px;
      box-sizing: border-box;
    }

    .hero-inner video,
    .mockup-with-text video,
    .mockup-with-text img,
    .stacked img,
    .stacked video {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 8px;
    }

    @media (max-width: 820px) {
      .hero { margin-top: 32px; } /* reduced for tablet/phone */
    }

    @media (max-width: 600px) {
      .back-button { display: none; } /* hide on phone */
    }

    @media (max-width: 420px) {
      .hero-inner,
      .stacked,
      .mockup-with-text { padding: 0 8px; }
    }
  </style>
</head>
<body>

  <a href="../project/projects.html" class="back-button"><span class="arrow">←</span> Back</a>

  <div class="hero">
    <div class="hero-inner">
      <!-- Top video stays at normal speed -->
      <video autoplay muted loop playsinline preload="metadata">
        <source src="../Videos/Udrust_frontpage.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <div class="stacked">
    <div class="mockup-with-text">
      <!-- Bottom video slowed down -->
      <video class="slow-video" autoplay muted loop playsinline preload="metadata">
        <source src="../Videos/Udrust_reel.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const slowVid = document.querySelector(".slow-video");
      if (slowVid) {
        slowVid.playbackRate = 0.5; // only bottom video slowed
      }
    });
  </script>

</body>
</html>
