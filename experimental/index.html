/* === RESET === */
* {
  box-sizing: border-box;
}

html {
  height: 100%;
  overflow-y: scroll;
}

body {
  margin: 0;
  background: #fbfbfb;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: #111;
  display: flex;
  flex-direction: column;
}

/* === LEFT SIDEBAR (match Projects) === */
.left {
  position: fixed;
  top: 0;
  left: 40px;
  width: 200px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 12px;
  line-height: 1.2;
  z-index: 1000;
  background: transparent;
  mix-blend-mode: difference;
  color: white;
  font-family: Helvetica, Arial, sans-serif;
  isolation: isolate;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
}

.left-top {
  padding-top: 20px;
}

.left p {
  margin: 0 0 24px 0;
  text-align: left;
  font-weight: 400;
}

.name {
  font-weight: 400;
  font-size: 12px;
  letter-spacing: -0.02em;
}

/* === LINKS (shared behavior) === */
.unstyled-link {
  all: unset;
  cursor: pointer;
  font-weight: 400;
}
.left .unstyled-link {
  display: inline-block;
  line-height: 1.2;
}
.left .nav-block .unstyled-link {
  min-height: 14px;
}
.left-top > p:nth-child(2) {
  cursor: pointer;
}
.unstyled-link.is-active {
  font-weight: 400;
  font-variation-settings: 'wght' 400;
  box-shadow: inset 0 0 0 999px rgba(128, 128, 128, 0.28);
}
.unstyled-link.is-active:hover {
  font-weight: 400;
  font-variation-settings: 'wght' 400;
}

.no-hover-link {
  all: unset;
  cursor: pointer;
  color: inherit;
}

.site-meta,
.site-nav {
  position: fixed;
  top: 6px;
  z-index: 1200;
  color: #000;
  font-size: 12px;
  line-height: 1.1;
  letter-spacing: 0;
  font-family: "ABC Monument Grotesk Trial", Helvetica, Arial, sans-serif;
  transition: opacity 180ms ease, transform 180ms ease;
}
.site-meta.left-meta { left: 6px; }
.site-meta.right-meta {
  right: 6px;
  text-align: right;
  width: auto;
  max-width: calc(100vw - 12px);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
}
.site-meta a,
.site-nav a {
  color: inherit;
  text-decoration: none;
  position: relative;
  isolation: isolate;
  transform: translateY(0) rotate(0deg);
  transition: color 140ms linear, transform 180ms cubic-bezier(.2, 1.4, .34, 1);
}
.site-meta a::before,
.site-meta a::after,
.site-nav a::before {
  content: "";
  position: absolute;
  opacity: 0;
  pointer-events: none;
  transition:
    opacity 120ms ease,
    transform 190ms cubic-bezier(.16, 1.6, .34, 1),
    background 140ms linear,
    box-shadow 140ms linear;
}
.site-meta a::before,
.site-nav a::before {
  inset: -2px -4px -3px;
  z-index: -1;
  border: 1px solid currentColor;
  border-radius: 5px;
  background: #fbfbfb;
  box-shadow: 3px 3px 0 currentColor;
  transform: translate(-1px, 2px) rotate(-2deg) scale(.86, .72);
}
.site-meta a::after {
  z-index: 1;
}
.site-meta a:hover,
.site-meta a:focus-visible,
.site-nav a:hover,
.site-nav a:focus-visible {
  transform: translateY(0) rotate(0deg);
  outline: none;
}
.site-meta a:hover::before,
.site-meta a:focus-visible::before,
.site-meta a:hover::after,
.site-meta a:focus-visible::after,
.site-nav a:hover::before,
.site-nav a:focus-visible::before {
  opacity: 1;
}
.site-meta .instagram-link::after {
  right: -10px;
  bottom: -8px;
  width: 12px;
  height: 12px;
  border: 1px solid currentColor;
  border-radius: 4px;
  background:
    radial-gradient(circle at 73% 27%, currentColor 0 1px, transparent 1.5px),
    radial-gradient(circle at 50% 53%, transparent 0 2.5px, currentColor 2.8px 3.5px, transparent 3.8px),
    #fbfbfb;
  transform: translate(-3px, 4px) rotate(-12deg) scale(.55);
}
.site-meta .instagram-link:hover::before,
.site-meta .instagram-link:focus-visible::before {
  transform: translate(0, 0) rotate(2deg) scale(1.04, .96);
}
.site-meta .instagram-link:hover::after,
.site-meta .instagram-link:focus-visible::after {
  transform: translate(0, 0) rotate(-12deg) scale(1);
}
.site-meta .email-link::after {
  right: -12px;
  bottom: -7px;
  width: 15px;
  height: 10px;
  border: 1px solid currentColor;
  border-radius: 2px;
  background:
    linear-gradient(30deg, transparent 45%, currentColor 47% 53%, transparent 55%) 0 0 / 50% 100% no-repeat,
    linear-gradient(150deg, transparent 45%, currentColor 47% 53%, transparent 55%) 100% 0 / 50% 100% no-repeat,
    #fbfbfb;
  box-shadow: 2px 2px 0 currentColor;
  transform: translate(-4px, 4px) rotate(10deg) scale(.55);
}
.site-meta .email-link:hover::before,
.site-meta .email-link:focus-visible::before {
  transform: translate(0, 0) rotate(-2deg) scale(1.04, .96);
}
.site-meta .email-link:hover::after,
.site-meta .email-link:focus-visible::after {
  transform: translate(0, 0) rotate(10deg) scale(1);
}
.location-full { display: inline; }
.location-short { display: none; }
.site-nav {
  left: 50%;
  text-align: center;
  transform: translateX(-50%);
  transition: opacity 180ms ease, transform 180ms ease;
  white-space: nowrap;
}
body.nav-hidden .site-nav {
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -8px);
}
body.nav-hidden .site-meta {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px);
}
.site-nav a::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1px;
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 180ms ease;
}
.site-nav a:hover::after,
.site-nav a:focus-visible::after,
.site-nav .is-active::after {
  transform: scaleX(1);
}
.site-nav a:hover::before,
.site-nav a:focus-visible::before {
  transform: translate(0, 0) rotate(-2deg) scale(1.04, .96);
}
.left,
.bottom { display: none; }

/* === ANIMATED TEXT === */
.animated-text { position: relative; display: inline-block; white-space: nowrap; }
.animated-word-inner { display: inline-block; }
.animated-word-inner::after {
  content: '|';
  display: inline-block;
  position: relative;
  top: -1px;
  color: #fff;
  margin-left: -1.5px;
  animation: blink-caret .75s step-end infinite;
  vertical-align: top;
}

.animated-text.is-deleting .animated-word-inner::after,
.animated-text.is-empty .animated-word-inner::after {
  opacity: 0;
}

@keyframes blink-caret {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Tighten gap between name and "Designer" label (same as Projects) */
.left .animated-text {
  margin-right: -0.15em;
  margin-top: -2px;
}

/* ===== Top-to-bottom load-in ===== */
@keyframes dropIn {
  0%   { opacity: 0; transform: translateY(18px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Start hidden only when JS is present */
.js .experimental-grid .card {
  opacity: 0;
  transform: translateY(18px);
  will-change: transform, opacity;
}
.js .experimental-grid .card.reveal-in {
  animation: dropIn .45s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: var(--stagger, 0ms);
}
@media (prefers-reduced-motion: reduce) {
  .js .experimental-grid .card {
    opacity: 1;
    transform: none;
  }
  .js .experimental-grid .card.reveal-in {
    animation: none !important;
  }
}

/* === GRID === */
.experimental-grid {
  margin-left: 300px;
  padding: 42px 24px 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  flex-grow: 1;
}

.card {
  break-inside: avoid;
  display: block;
  position: relative;
  width: 100%;
  background: none;
  grid-column: span 2;
}

.card.aspect-1-1 {
  grid-column: span 1;
}

.card img,
.card video,
.card iframe {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  border: none;
  pointer-events: auto;
  opacity: 1;
  transition: opacity 0.5s ease-out;
  background: #f0f0f0;
}

.card.aspect-16-9 video,
.card.aspect-16-9 img,
.card.aspect-16-9 iframe {
  aspect-ratio: 16 / 9;
}

.card.aspect-9-16 video,
.card.aspect-9-16 img {
  aspect-ratio: 9 / 16;
}

.card.spotlight-card {
  grid-column: span 2;
}

.spotlight-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
}

.spotlight-grid video {
  aspect-ratio: 9 / 16;
  height: auto;
}

.card.aspect-1-1 video,
.card.aspect-1-1 img {
  aspect-ratio: 1 / 1;
}

.card.aspect-4-5 video,
.card.aspect-4-5 img {
  aspect-ratio: 4 / 5;
}

.card.kindagarden-card {
  grid-column: span 1;
  width: 100%;
  justify-self: stretch;
}

.card.aspect-1-1.large {
  grid-column: span 2;
}

/* === MEDIA LABELS === */
.media-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.card.no-curtain .media-wrapper {
  overflow: hidden;
}

.card.no-curtain iframe {
  transform: scale(1.18);
  transform-origin: center;
}

.corner-text {
  position: absolute;
  top: 8px;
  left: 8px;
  font-size: 12px;
  font-weight: 500;
  color: #111;
  pointer-events: none;
  opacity: 0;
}

.corner-text.light {
  color: white;
}

.interactive-label {
  position: absolute;
  top: -2px;
  left: -8px;
  transform: translateX(-100%);
  font-size: 11px;
  font-weight: 500;
  color: #111;
  pointer-events: none;
}

/* === BOTTOM === */
.bottom {
  position: fixed;
  bottom: 40px;
  left: 40px;
  width: 220px;
  font-size: 12px;
  line-height: 1.2;
  color: #fff;
  background: transparent;
  mix-blend-mode: difference;
  z-index: 1200;
  padding-bottom: 12px;
}

.bottom p {
  margin: 0;
}

.bottom p + p {
  margin-top: 32px;
}
.contact-swap .hover-text { display: none; }
.contact-swap:hover .default-text { display: none; }
.contact-swap:hover .hover-text { display: inline; }

/* === RESPONSIVE === */
@media (max-width: 1024px) {
  .experimental-grid {
    grid-template-columns: 1fr;
    margin-left: 220px;
  }

  .card {
    grid-column: span 1 !important;
  }
}

@media (max-width: 900px) {

  }
}

  <script>
    (function siteMeta(){
      const clocks = document.querySelectorAll('.local-clock');
      const temps = document.querySelectorAll('.weather-temp');
      const conditions = document.querySelectorAll('.weather-condition');

      function setAll(nodes, text) {
        nodes.forEach(node => { node.textContent = text; });
      }

      function updateClock() {
        const time = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Copenhagen',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
          timeZoneName: 'short'
        }).format(new Date());
        setAll(clocks, time);
      }

      function weatherCodeLabel(code) {
        if (code === 0) return 'clear';
        if ([1, 2].includes(code)) return 'partly cloudy';
        if (code === 3) return 'cloudy';
        if ([45, 48].includes(code)) return 'fog';
        if ([51, 53, 55].includes(code)) return 'drizzle';
        if ([56, 57].includes(code)) return 'freezing drizzle';
        if ([61, 63, 65].includes(code)) return code === 61 ? 'slight rain' : 'rain';
        if ([66, 67].includes(code)) return 'freezing rain';
        if ([71, 73, 75].includes(code)) return code === 71 ? 'slight snow' : 'snow';
        if (code === 77) return 'snow grains';
        if ([80, 81, 82].includes(code)) return code === 80 ? 'rain showers' : 'heavy showers';
        if ([85, 86].includes(code)) return 'snow showers';
        if ([95, 96, 99].includes(code)) return 'thunderstorm';
        return '--';
      }

      function readCachedWeather() {
        try {
          const cached = JSON.parse(localStorage.getItem('niklasSiteWeather') || 'null');
          if (!cached || Date.now() - cached.timestamp > 30 * 60 * 1000) return false;
          setAll(temps, cached.temp || '--\u00b0C');
          setAll(conditions, cached.condition || '--');
          return true;
        } catch (_) {
          return false;
        }
      }

      function writeCachedWeather(temp, condition) {
        try {
          localStorage.setItem('niklasSiteWeather', JSON.stringify({
            temp,
            condition,
            timestamp: Date.now()
          }));
        } catch (_) {}
      }

      async function updateWeather() {
        try {
          const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=55.6761&longitude=12.5683&current=temperature_2m,weather_code&timezone=Europe%2FCopenhagen', { cache: 'no-store' });
          if (!response.ok) throw new Error('Weather request failed');
          const data = await response.json();
          const temperature = data.current?.temperature_2m;
          const unit = data.current_units?.temperature_2m || '\u00b0C';
          const tempText = typeof temperature === 'number' ? `${Math.round(temperature)}${unit}` : '--\u00b0C';
          const conditionText = weatherCodeLabel(data.current?.weather_code);
          setAll(temps, tempText);
          setAll(conditions, conditionText);
          writeCachedWeather(tempText, conditionText);
        } catch (_) {
          if (!readCachedWeather()) {
            setAll(temps, '--\u00b0C');
            setAll(conditions, '--');
          }
        }
      }

      updateClock();
      setInterval(updateClock, 1000);
      readCachedWeather();
      updateWeather();
      setInterval(updateWeather, 10 * 60 * 1000);

      let lastScrollY = window.scrollY;
      window.addEventListener('scroll', () => {
        const currentY = window.scrollY;
        const delta = currentY - lastScrollY;

        if (currentY <= 16 || delta < -4) {
          document.body.classList.remove('nav-hidden');
        } else if (currentY > 36 && delta > 3) {
          document.body.classList.add('nav-hidden');
        }

        lastScrollY = currentY;
      }, { passive: true });
    })();
  </script>

  <script>
    // Typewriter for the "Designer" label (same behavior as other pages)
    document.addEventListener('DOMContentLoaded', () => {
      const animatedTextContainer = document.querySelector('.animated-text');
      const animatedWordInner = document.querySelector('.animated-word-inner');
      const words = ['Interactive', 'Graphic', 'Motion'];
      const STORAGE_KEY = 'navDesignerWordIndex';
      const STARTED_KEY = 'navDesignerWordStartedAt';
      let currentIndex = 0;
      let hasSavedIndex = false;
      let savedWordStartedAt = 0;

      try {
        const savedIndex = Number.parseInt(sessionStorage.getItem(STORAGE_KEY) || '', 10);
        if (Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < words.length) {
          currentIndex = savedIndex;
          hasSavedIndex = true;
        }
        savedWordStartedAt = Number.parseInt(sessionStorage.getItem(STARTED_KEY) || '0', 10) || 0;
      } catch (_) {}
      const typingSpeed = 70, deletingSpeed = 40, wordDisplayTime = 3000, pauseBeforeTyping = 300;

      if (animatedTextContainer && animatedWordInner) {
        const measuringDiv = document.createElement('div');
        Object.assign(measuringDiv.style, { position:'absolute', visibility:'hidden', whiteSpace:'nowrap', zIndex:'-1' });
        document.body.appendChild(measuringDiv);

        const computedStyle = getComputedStyle(animatedWordInner);
        Object.assign(measuringDiv.style, {
          fontFamily: computedStyle.fontFamily,
          fontSize: computedStyle.fontSize,
          fontWeight: computedStyle.fontWeight,
          letterSpacing: computedStyle.letterSpacing,
          lineHeight: computedStyle.lineHeight,
          textTransform: computedStyle.textTransform
        });

        const getTextWidth = (text) => { measuringDiv.textContent = text; return measuringDiv.offsetWidth; };
        const saveCurrentIndex = () => {
          try {
            sessionStorage.setItem(STORAGE_KEY, String(currentIndex));
            sessionStorage.setItem(STARTED_KEY, String(Date.now()));
          } catch (_) {}
        };

        const typeWord = (word, done) => {
          let i = 0;
          animatedTextContainer.classList.remove('is-deleting', 'is-empty');
          animatedWordInner.textContent = '';
          const iv = setInterval(() => {
            if (i < word.length) {
              animatedWordInner.textContent += word[i++];
              animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
            } else { clearInterval(iv); done && done(); }
          }, typingSpeed);
        };

        const deleteWord = (done) => {
          let text = animatedWordInner.textContent;
          animatedTextContainer.classList.add('is-deleting');
          const iv = setInterval(() => {
            if (text.length) {
              text = text.slice(0, -1);
              animatedWordInner.textContent = text;
              animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
            } else {
              clearInterval(iv);
              animatedTextContainer.classList.add('is-empty');
              animatedTextContainer.style.width = '0px';
              done && done();
            }
          }, deletingSpeed);
        };

        const loop = () => {
          const currentWord = words[currentIndex];
          typeWord(currentWord, () => {
            saveCurrentIndex();
            setTimeout(() => {
              deleteWord(() => {
                setTimeout(() => {
                  currentIndex = (currentIndex + 1) % words.length;
                  loop();
                }, pauseBeforeTyping);
              });
            }, wordDisplayTime);
          });
        };

        if (hasSavedIndex) {
          animatedTextContainer.classList.remove('is-deleting', 'is-empty');
          animatedWordInner.textContent = words[currentIndex];
          animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
          const remainingDisplayTime = Math.max(0, wordDisplayTime - (Date.now() - savedWordStartedAt));
          setTimeout(() => {
            deleteWord(() => {
              setTimeout(() => {
                currentIndex = (currentIndex + 1) % words.length;
                loop();
              }, pauseBeforeTyping);
            });
          }, remainingDisplayTime);
        } else {
          saveCurrentIndex();
          loop();
        }
      }

      /* ===== Edge scroll: Experimental -> Projects ===== */
      (function experimentalEdgeNav(){
        const PREV_PATH = '/project/';
        const EDGE_TOP = 2;
        const WHEEL_UP_THRESHOLD = 360;
        const SWIPE_THRESHOLD = 140;
        let navLocked = false;
        let wheelAccum = 0;
        let touchStartY = null;

        function atTop(){
          const y = window.scrollY || document.documentElement.scrollTop || 0;
          return y <= EDGE_TOP;
        }

        function goPrev(){
          if (navLocked) return;
          navLocked = true;
          try { sessionStorage.setItem('projectEdgeStart', 'bottom'); } catch (_) {}
          window.location.href = PREV_PATH;
        }

        function resetEdgeIntent(){
          wheelAccum = 0;
        }

        window.addEventListener('wheel', (e) => {
          if (navLocked) return;
          const dy = e.deltaY || 0;
          if (dy >= 0 || !atTop()) { resetEdgeIntent(); return; }
          wheelAccum += Math.max(dy, -80);
          if (wheelAccum <= -WHEEL_UP_THRESHOLD) goPrev();
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
          touchStartY = e.touches[0]?.clientY ?? null;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
          if (navLocked || touchStartY == null) return;
          const endY = e.changedTouches[0]?.clientY ?? touchStartY;
          const delta = touchStartY - endY;
          touchStartY = null;
          if (atTop() && delta <= -SWIPE_THRESHOLD) {
            goPrev();
            return;
          }
          resetEdgeIntent();
        }, { passive: true });
      })();

      /* ===== Top-to-bottom reveal and lazy media loading ===== */
      const cards = Array.from(document.querySelectorAll('.experimental-grid .card'));
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Reset the interactive "signal" iframe when leaving its card
      const signalIframe = document.querySelector('.experimental-grid .card iframe[data-src*="index_no_curtain.html"], .experimental-grid .card iframe[src*="index_no_curtain.html"]');
      if (signalIframe) {
        const signalCard = signalIframe.closest('.card');
        if (signalCard) {
          signalCard.addEventListener('mouseleave', () => {
            const iframeWindow = signalIframe.contentWindow;
            if (iframeWindow && typeof iframeWindow.resetHeadlineState === 'function') {
              iframeWindow.resetHeadlineState();
            }
          });
        }
      }

      if (!cards.length) return;

      function hydrateMediaElement(media) {
        if (media.dataset.loaded === '1') return;

        if (media.tagName === 'IFRAME' || media.tagName === 'IMG') {
          const src = media.dataset.src;
          if (src) {
            media.src = src;
            media.dataset.loaded = '1';
          }
          return;
        }

        if (media.tagName === 'VIDEO') {
          const src = media.dataset.src;
          if (src) media.src = src;

          media.querySelectorAll('source[data-src]').forEach(source => {
            source.src = source.dataset.src;
            source.removeAttribute('data-src');
          });

          media.preload = 'auto';
          media.dataset.loaded = '1';
          media.load();
          const play = media.play();
          if (play && typeof play.catch === 'function') play.catch(() => {});
        }
      }

      function hydrateCardMedia(card) {
        card.querySelectorAll('video, img, iframe').forEach(hydrateMediaElement);
      }

      function revealCard(card, index) {
        if (card.classList.contains('reveal-in')) return;
        card.style.setProperty('--stagger', prefersReduced ? '0ms' : `${Math.min(index * 60, 720)}ms`);
        card.classList.add('reveal-in');
      }

      requestAnimationFrame(() => {
        cards.forEach((card, index) => revealCard(card, index));
      });

      const hydrateObserver = new IntersectionObserver((entries) => {
        entries
          .filter(e => e.isIntersecting)
          .sort((a, b) => cards.indexOf(a.target) - cards.indexOf(b.target))
          .forEach(entry => {
            hydrateObserver.unobserve(entry.target);
            hydrateCardMedia(entry.target);
          });
      }, {
        root: null,
        rootMargin: '900px 0px',
        threshold: 0.01
      });

      cards.forEach(card => {
        hydrateObserver.observe(card);
        card.addEventListener('mouseenter', () => hydrateCardMedia(card), { once: true });
        card.addEventListener('focusin', () => hydrateCardMedia(card), { once: true });
      });
    });
  </script>

</body>
