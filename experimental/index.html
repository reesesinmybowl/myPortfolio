  <style>
/* === RESET === */
* {
  box-sizing: border-box;
}

html {
  height: 100%;
  overflow-y: scroll;
}

body {
  margin: 0;
  background: #fbfbfb;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: #111;
  display: flex;
  flex-direction: column;
}

/* === LEFT SIDEBAR (match Projects) === */
.left {
  position: fixed;
  top: 0;
  left: 40px;
  width: 200px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 12px;
  line-height: 1.2;
  z-index: 1000;
  background: transparent;
  mix-blend-mode: difference;
  color: white;
  font-family: "Univers LT 55", "Univers LT Std", "Univers LT 55 Regular", "Univers", -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", sans-serif;
  isolation: isolate;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
}

.left-top {
  padding-top: 20px;
}

.left p {
  margin: 0 0 24px 0;
  text-align: left;
  font-weight: 400;
}

.name {
  font-weight: 600;
  font-size: 12px;
  letter-spacing: -0.02em;
}

/* === LINKS (shared behavior) === */
.unstyled-link {
  all: unset;
  cursor: pointer;
  font-weight: 400;
  transition: font-weight 0.2s ease;
}

.unstyled-link:not(.no-hover-link):hover {
  font-weight: 700;
}
.unstyled-link.is-active {
  font-weight: 600;
  font-variation-settings: 'wght' 600;
}

.no-hover-link {
  all: unset;
  cursor: pointer;
  color: inherit;
}

/* === ANIMATED TEXT === */
.animated-text { position: relative; display: inline-block; white-space: nowrap; }
.animated-word-inner { display: inline-block; }
.animated-word-inner::after {
  content: '|';
  display: inline-block;
  position: relative;
  top: -1px;
  color: #fff;
  margin-left: -1.5px;
  animation: blink-caret .75s step-end infinite;
  vertical-align: top;
}

.animated-text.is-deleting .animated-word-inner::after,
.animated-text.is-empty .animated-word-inner::after {
  opacity: 0;
}

@keyframes blink-caret {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Tighten gap between name and "Designer" label (same as Projects) */
.left .animated-text {
  margin-right: -0.15em;
  margin-top: -2px;
}

/* ===== Trickle-down load-in (match Projects) ===== */
@keyframes dropIn {
  0%   { opacity: 0; transform: translateY(-32px); filter: drop-shadow(0 8px 0 rgba(0,0,0,0)); }
  60%  { opacity: 1; transform: translateY(2px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Start hidden only when JS is present */
.js .experimental-grid .card {
  opacity: 0;
  transform: translateY(-32px);
  will-change: transform, opacity;
}
.js .experimental-grid .card.reveal-in {
  animation: dropIn .8s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: var(--stagger, 0ms);
}
@media (prefers-reduced-motion: reduce) {
  .js .experimental-grid .card {
    opacity: 1;
    transform: none;
  }
  .js .experimental-grid .card.reveal-in {
    animation: none !important;
  }
}

/* === GRID === */
.experimental-grid {
  margin-left: 300px;
  padding: 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  flex-grow: 1;
}

.card {
  break-inside: avoid;
  display: block;
  position: relative;
  width: 100%;
  background: none;
  grid-column: span 2;
}

.card.aspect-1-1 {
  grid-column: span 1;
}

.card img,
.card video,
.card iframe {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  border: none;
  pointer-events: auto;
  opacity: 1;
  transition: opacity 0.5s ease-out;
}

.card.aspect-16-9 video,
.card.aspect-16-9 img,
.card.aspect-16-9 iframe {
  aspect-ratio: 16 / 9;
}

.card.aspect-9-16 video,
.card.aspect-9-16 img {
  aspect-ratio: 9 / 16;
}

.card.aspect-1-1 video,
.card.aspect-1-1 img {
  aspect-ratio: 1 / 1;
}

.card.aspect-4-5 video,
.card.aspect-4-5 img {
  aspect-ratio: 4 / 5;
}

.card.kindagarden-card {
  grid-column: span 1;
  width: 100%;
  justify-self: stretch;
}

.card.aspect-1-1.large {
  grid-column: span 2;
}

/* === MEDIA LABELS === */
.media-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.card.no-curtain .media-wrapper {
  overflow: hidden;
}

.card.no-curtain iframe {
  transform: scale(1.18);
  transform-origin: center;
}

.corner-text {
  position: absolute;
  top: 8px;
  left: 8px;
  font-size: 12px;
  font-weight: 500;
  color: #111;
  pointer-events: none;
  opacity: 0;
}

.corner-text.light {
  color: white;
}

.interactive-label {
  position: absolute;
  top: -2px;
  left: -8px;
  transform: translateX(-100%);
  font-size: 11px;
  font-weight: 500;
  color: #111;
  pointer-events: none;
}

/* === BOTTOM === */
.bottom {
  position: fixed;
  bottom: 40px;
  left: 40px;
  width: 220px;
  font-size: 12px;
  line-height: 1.35;
  color: #fff;
  background: transparent;
  mix-blend-mode: difference;
  z-index: 1200;
  padding-bottom: 12px;
}

.bottom p {
  margin: 0;
}

.bottom p + p {
  margin-top: 32px;
}

/* === RESPONSIVE === */
@media (max-width: 1024px) {
  .experimental-grid {
    grid-template-columns: 1fr;
    margin-left: 220px;
  }

  .card {
    grid-column: span 1 !important;
  }
}

@media (max-width: 900px) {
  .left {
    position: fixed;
    top: 8px;
    left: 16px;
    width: calc(100vw - 32px);
    padding: 0;
    color: black;
    mix-blend-mode: normal;
  }
  .left p { margin: 0; }
  .left-top {
    padding-top: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .left-top p:first-child a { font-size: 12px; line-height: 1.1; }
  .left-top p:first-child a br { display: none; }
  .left-top p:first-child .animated-text { display: inline-block; white-space: nowrap; }
  .left-top p:first-child .name { font-size: 12px; line-height: 1.1; display: block; }
  .left p + p { padding-top: 0; text-align: right; white-space: nowrap; }
  .left p + p br { display: none; }
  .left p + p a + a::before { content: " / "; }

  .experimental-grid {
    margin-left: 0;
    padding: 120px 16px 16px;
    grid-template-columns: 1fr;
  }

  .card {
    grid-column: span 1 !important;
  }

  .card.aspect-16-9 .media-wrapper { aspect-ratio: 16 / 9; }
  .card iframe { height: 100%; }
  .card.no-curtain iframe {
    transform: scale(1.28);
  }

  .interactive-label { display: none; }

  .bottom {
    position: static;
    mix-blend-mode: normal;
    color: #000;
    padding: 0 16px 16px;
    margin-top: auto;
  }
}

  <script>
    // Typewriter for the "Designer" label (same behavior as other pages)
    document.addEventListener('DOMContentLoaded', () => {
      const animatedTextContainer = document.querySelector('.animated-text');
      const animatedWordInner = document.querySelector('.animated-word-inner');
      const words = ['Interactive', 'Graphic', 'Motion'];
      const STORAGE_KEY = 'navDesignerWordIndex';
      let currentIndex = 0;
      let hasSavedIndex = false;

      try {
        const savedIndex = Number.parseInt(sessionStorage.getItem(STORAGE_KEY) || '', 10);
        if (Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < words.length) {
          currentIndex = savedIndex;
          hasSavedIndex = true;
        }
      } catch (_) {}
      const typingSpeed = 70, deletingSpeed = 40, wordDisplayTime = 3000, pauseBeforeTyping = 300;

      if (animatedTextContainer && animatedWordInner) {
        const measuringDiv = document.createElement('div');
        Object.assign(measuringDiv.style, { position:'absolute', visibility:'hidden', whiteSpace:'nowrap', zIndex:'-1' });
        document.body.appendChild(measuringDiv);

        const computedStyle = getComputedStyle(animatedWordInner);
        Object.assign(measuringDiv.style, {
          fontFamily: computedStyle.fontFamily,
          fontSize: computedStyle.fontSize,
          fontWeight: computedStyle.fontWeight,
          letterSpacing: computedStyle.letterSpacing,
          lineHeight: computedStyle.lineHeight,
          textTransform: computedStyle.textTransform
        });

        const getTextWidth = (text) => { measuringDiv.textContent = text; return measuringDiv.offsetWidth; };
        const saveCurrentIndex = () => {
          try { sessionStorage.setItem(STORAGE_KEY, String(currentIndex)); } catch (_) {}
        };

        const typeWord = (word, done) => {
          let i = 0;
          animatedTextContainer.classList.remove('is-deleting', 'is-empty');
          animatedWordInner.textContent = '';
          const iv = setInterval(() => {
            if (i < word.length) {
              animatedWordInner.textContent += word[i++];
              animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
            } else { clearInterval(iv); done && done(); }
          }, typingSpeed);
        };

        const deleteWord = (done) => {
          let text = animatedWordInner.textContent;
          animatedTextContainer.classList.add('is-deleting');
          const iv = setInterval(() => {
            if (text.length) {
              text = text.slice(0, -1);
              animatedWordInner.textContent = text;
              animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
            } else {
              clearInterval(iv);
              animatedTextContainer.classList.add('is-empty');
              animatedTextContainer.style.width = '0px';
              done && done();
            }
          }, deletingSpeed);
        };

        const loop = () => {
          const currentWord = words[currentIndex];
          typeWord(currentWord, () => {
            setTimeout(() => {
              deleteWord(() => {
                setTimeout(() => {
                  currentIndex = (currentIndex + 1) % words.length;
                  saveCurrentIndex();
                  loop();
                }, pauseBeforeTyping);
              });
            }, wordDisplayTime);
          });
        };

        if (hasSavedIndex) {
          animatedTextContainer.classList.remove('is-deleting', 'is-empty');
          animatedWordInner.textContent = words[currentIndex];
          animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
          setTimeout(() => {
            deleteWord(() => {
              setTimeout(() => {
                currentIndex = (currentIndex + 1) % words.length;
                saveCurrentIndex();
                loop();
              }, pauseBeforeTyping);
            });
          }, wordDisplayTime);
        } else {
          saveCurrentIndex();
          loop();
        }
      }

      /* ===== Edge scroll: Experimental -> Projects ===== */
      (function experimentalEdgeNav(){
        const PREV_PATH = '/project/';
        const EDGE_TOP = 14;
        const WHEEL_UP_THRESHOLD = 120;
        const SWIPE_THRESHOLD = 64;
        let navLocked = false;
        let wheelAccum = 0;
        let touchStartY = null;

        function atTop(){
          const y = window.scrollY || document.documentElement.scrollTop || 0;
          return y <= EDGE_TOP;
        }

        function goPrev(){
          if (navLocked) return;
          navLocked = true;
          try { sessionStorage.setItem('projectEdgeStart', 'bottom'); } catch (_) {}
          window.location.href = PREV_PATH;
        }

        window.addEventListener('wheel', (e) => {
          if (navLocked) return;
          const dy = e.deltaY || 0;
          if (dy >= 0 || !atTop()) { wheelAccum = 0; return; }
          wheelAccum += Math.max(dy, -80);
          if (wheelAccum <= -WHEEL_UP_THRESHOLD) goPrev();
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
          touchStartY = e.touches[0]?.clientY ?? null;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
          if (navLocked || touchStartY == null) return;
          const endY = e.changedTouches[0]?.clientY ?? touchStartY;
          const delta = touchStartY - endY;
          touchStartY = null;
          if (atTop() && delta <= -SWIPE_THRESHOLD) goPrev();
        }, { passive: true });
      })();

      /* ===== Trickle-down load-in for experimental tiles (match Projects) ===== */
      const cards = Array.from(document.querySelectorAll('.experimental-grid .card'));
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Reset the interactive "signal" iframe when leaving its card
      const signalIframe = document.querySelector('.experimental-grid .card iframe[src*="index_no_curtain.html"]');
      if (signalIframe) {
        const signalCard = signalIframe.closest('.card');
        if (signalCard) {
          signalCard.addEventListener('mouseleave', () => {
            const iframeWindow = signalIframe.contentWindow;
            if (iframeWindow && typeof iframeWindow.resetHeadlineState === 'function') {
              iframeWindow.resetHeadlineState();
            }
          });
        }
      }

      if (!cards.length) return;

      // Helper: wait for card's primary media (img/video) to be ready
      function waitForCardMedia(card, timeoutMs = 2000) {
        const img = card.querySelector('img');
        const vid = card.querySelector('video');
        let p = Promise.resolve();

        if (img) {
          if (img.complete && img.naturalWidth > 0) {
            p = Promise.resolve();
          } else if ('decode' in img) {
            p = img.decode().catch(() => {});
          }
        } else if (vid) {
          if (vid.readyState >= 2) {
            p = Promise.resolve();
          } else {
            p = new Promise(res => {
              const onReady = () => { cleanup(); res(); };
              const cleanup = () => {
                vid.removeEventListener('loadeddata', onReady);
                vid.removeEventListener('canplay', onReady);
              };
              vid.addEventListener('loadeddata', onReady, { once: true });
              vid.addEventListener('canplay', onReady, { once: true });
            });
          }
        }

        return Promise.race([
          p,
          new Promise(res => setTimeout(res, timeoutMs))
        ]);
      }

      // If reduced motion, reveal without animation and skip waiting
      if (prefersReduced) {
        cards.forEach(el => el.classList.add('reveal-in'));
        return;
      }

      const baseDelay = 140; // ms between items
      const initialCount = Math.min(4, cards.length);

      // Reveal first few tiles sequentially
      (async () => {
        for (let i = 0; i < initialCount; i++) {
          const el = cards[i];
          await waitForCardMedia(el);
          el.style.setProperty('--stagger', '0ms');
          requestAnimationFrame(() => el.classList.add('reveal-in'));
          await new Promise(r => setTimeout(r, baseDelay));
        }
      })();

      // Reveal remaining tiles as they enter viewport
      const io = new IntersectionObserver(async (entries) => {
        const intersecting = entries
          .filter(e => e.isIntersecting && !e.target.classList.contains('reveal-in'))
          .sort((a, b) => cards.indexOf(a.target) - cards.indexOf(b.target))
          .map(e => e.target);

        for (const el of intersecting) {
          io.unobserve(el);
          await waitForCardMedia(el);
          el.style.setProperty('--stagger', '0ms');
          requestAnimationFrame(() => el.classList.add('reveal-in'));
          await new Promise(r => setTimeout(r, baseDelay));
        }
      }, {
        root: null,
        rootMargin: '0px 0px -20% 0px',
        threshold: 0.2
      });

      cards.slice(initialCount).forEach(el => io.observe(el));
    });
  </script>
