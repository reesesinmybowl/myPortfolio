  <style>
/* === RESET === */
* {
  box-sizing: border-box;
}

html {
  height: 100%;
  overflow-y: scroll;
}

body {
  margin: 0;
  background: #fbfbfb;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: #111;
  display: flex;
  flex-direction: column;
}

/* === LEFT SIDEBAR (match Projects) === */
.left {
  position: fixed;
  top: 0;
  left: 40px;
  width: 200px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 12px;
  line-height: 1.2;
  z-index: 1000;
  background: transparent;
  mix-blend-mode: difference;
  color: white;
  font-family: "Univers LT 55", "Univers LT Std", "Univers LT 55 Regular", "Univers", -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", sans-serif;
  isolation: isolate;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform: translateZ(0);
}

.left-top {
  padding-top: 20px;
}

.left p {
  margin: 0 0 24px 0;
  text-align: left;
  font-weight: 400;
}

.name {
  font-weight: 400;
  font-size: 12px;
  letter-spacing: -0.02em;
}

/* === LINKS (shared behavior) === */
.unstyled-link {
  all: unset;
  cursor: pointer;
  font-weight: 400;
}
.left .unstyled-link {
  display: inline-block;
  line-height: 1.2;
}
.left .nav-block .unstyled-link {
  min-height: 14px;
}
.left-top > p:nth-child(2) {
  cursor: pointer;
}
.unstyled-link.is-active {
  font-weight: 400;
  font-variation-settings: 'wght' 400;
  box-shadow: inset 0 0 0 999px rgba(128, 128, 128, 0.28);
}
.unstyled-link.is-active:hover {
  font-weight: 400;
  font-variation-settings: 'wght' 400;
}

.no-hover-link {
  all: unset;
  cursor: pointer;
  color: inherit;
}

/* === ANIMATED TEXT === */
.animated-text { position: relative; display: inline-block; white-space: nowrap; }
.animated-word-inner { display: inline-block; }
.animated-word-inner::after {
  content: '|';
  display: inline-block;
  position: relative;
  top: -1px;
  color: #fff;
  margin-left: -1.5px;
  animation: blink-caret .75s step-end infinite;
  vertical-align: top;
}

.animated-text.is-deleting .animated-word-inner::after,
.animated-text.is-empty .animated-word-inner::after {
  opacity: 0;
}

@keyframes blink-caret {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Tighten gap between name and "Designer" label (same as Projects) */
.left .animated-text {
  margin-right: -0.15em;
  margin-top: -2px;
}

/* ===== Top-to-bottom load-in ===== */
@keyframes dropIn {
  0%   { opacity: 0; transform: translateY(18px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Start hidden only when JS is present */
.js .experimental-grid .card {
  opacity: 0;
  transform: translateY(18px);
  will-change: transform, opacity;
}
.js .experimental-grid .card.reveal-in {
  animation: dropIn .45s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: var(--stagger, 0ms);
}
@media (prefers-reduced-motion: reduce) {
  .js .experimental-grid .card {
    opacity: 1;
    transform: none;
  }
  .js .experimental-grid .card.reveal-in {
    animation: none !important;
  }
}

/* === GRID === */
.experimental-grid {
  margin-left: 300px;
  padding: 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  flex-grow: 1;
}

.card {
  break-inside: avoid;
  display: block;
  position: relative;
  width: 100%;
  background: none;
  grid-column: span 2;
}

.card.aspect-1-1 {
  grid-column: span 1;
}

.card img,
.card video,
.card iframe {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
  border: none;
  pointer-events: auto;
  opacity: 1;
  transition: opacity 0.5s ease-out;
  background: #f0f0f0;
}

.card.aspect-16-9 video,
.card.aspect-16-9 img,
.card.aspect-16-9 iframe {
  aspect-ratio: 16 / 9;
}

.card.aspect-9-16 video,
.card.aspect-9-16 img {
  aspect-ratio: 9 / 16;
}

.card.spotlight-card {
  grid-column: span 2;
}

.spotlight-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
}

.spotlight-grid video {
  aspect-ratio: 9 / 16;
  height: auto;
}

.card.aspect-1-1 video,
.card.aspect-1-1 img {
  aspect-ratio: 1 / 1;
}

.card.aspect-4-5 video,
.card.aspect-4-5 img {
  aspect-ratio: 4 / 5;
}

.card.kindagarden-card {
  grid-column: span 1;
  width: 100%;
  justify-self: stretch;
}

.card.aspect-1-1.large {
  grid-column: span 2;
}

/* === MEDIA LABELS === */
.media-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
}

.card.no-curtain .media-wrapper {
  overflow: hidden;
}

.card.no-curtain iframe {
  transform: scale(1.18);
  transform-origin: center;
}

.corner-text {
  position: absolute;
  top: 8px;
  left: 8px;
  font-size: 12px;
  font-weight: 500;
  color: #111;
  pointer-events: none;
  opacity: 0;
}

.corner-text.light {
  color: white;
}

.interactive-label {
  position: absolute;
  top: -2px;
  left: -8px;
  transform: translateX(-100%);
  font-size: 11px;
  font-weight: 500;
  color: #111;
  pointer-events: none;
}

/* === BOTTOM === */
.bottom {
  position: fixed;
  bottom: 40px;
  left: 40px;
  width: 220px;
  font-size: 12px;
  line-height: 1.2;
  color: #fff;
  background: transparent;
  mix-blend-mode: difference;
  z-index: 1200;
  padding-bottom: 12px;
}

.bottom p {
  margin: 0;
}

.bottom p + p {
  margin-top: 32px;
}
.contact-swap .hover-text { display: none; }
.contact-swap:hover .default-text { display: none; }
.contact-swap:hover .hover-text { display: inline; }

/* === RESPONSIVE === */
@media (max-width: 1024px) {
  .experimental-grid {
    grid-template-columns: 1fr;
    margin-left: 220px;
  }

  .card {
    grid-column: span 1 !important;
  }
}

@media (max-width: 900px) {
  .left {
    position: fixed;
    top: 8px;
    left: 16px;
    width: calc(100vw - 32px);
    padding: 0;
    color: black;
    mix-blend-mode: normal;
  }
  .left p { margin: 0; }
  .left-top {
    padding-top: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .left-top p:first-child a { font-size: 12px; line-height: 1.1; }
  .left-top p:first-child a br { display: none; }
  .left-top p:first-child .animated-text { display: inline-block; white-space: nowrap; }
  .left-top p:first-child .name { font-size: 12px; line-height: 1.1; display: block; }
  .left p + p { padding-top: 0; text-align: right; white-space: nowrap; }
  .left p + p br { display: none; }
  .left p + p a + a::before { content: " / "; }

  .experimental-grid {
    margin-left: 0;
    padding: 120px 16px 16px;
    grid-template-columns: 1fr;
  }

  .card {
    grid-column: span 1 !important;
  }

  .spotlight-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .card.aspect-16-9 .media-wrapper { aspect-ratio: 16 / 9; }
  .card iframe { height: 100%; }
  .card.no-curtain iframe {
    transform: scale(1.28);
  }

  .interactive-label { display: none; }

  .bottom {
    position: static;
    mix-blend-mode: normal;
    color: #000;
    padding: 0 16px 16px;
    margin-top: auto;
  }
}

  <script>
    // Typewriter for the "Designer" label (same behavior as other pages)
    document.addEventListener('DOMContentLoaded', () => {
      const animatedTextContainer = document.querySelector('.animated-text');
      const animatedWordInner = document.querySelector('.animated-word-inner');
      const words = ['Interactive', 'Graphic', 'Motion'];
      const STORAGE_KEY = 'navDesignerWordIndex';
      const STARTED_KEY = 'navDesignerWordStartedAt';
      let currentIndex = 0;
      let hasSavedIndex = false;
      let savedWordStartedAt = 0;

      try {
        const savedIndex = Number.parseInt(sessionStorage.getItem(STORAGE_KEY) || '', 10);
        if (Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < words.length) {
          currentIndex = savedIndex;
          hasSavedIndex = true;
        }
        savedWordStartedAt = Number.parseInt(sessionStorage.getItem(STARTED_KEY) || '0', 10) || 0;
      } catch (_) {}
      const typingSpeed = 70, deletingSpeed = 40, wordDisplayTime = 3000, pauseBeforeTyping = 300;

      if (animatedTextContainer && animatedWordInner) {
        const measuringDiv = document.createElement('div');
        Object.assign(measuringDiv.style, { position:'absolute', visibility:'hidden', whiteSpace:'nowrap', zIndex:'-1' });
        document.body.appendChild(measuringDiv);

        const computedStyle = getComputedStyle(animatedWordInner);
        Object.assign(measuringDiv.style, {
          fontFamily: computedStyle.fontFamily,
          fontSize: computedStyle.fontSize,
          fontWeight: computedStyle.fontWeight,
          letterSpacing: computedStyle.letterSpacing,
          lineHeight: computedStyle.lineHeight,
          textTransform: computedStyle.textTransform
        });

        const getTextWidth = (text) => { measuringDiv.textContent = text; return measuringDiv.offsetWidth; };
        const saveCurrentIndex = () => {
          try {
            sessionStorage.setItem(STORAGE_KEY, String(currentIndex));
            sessionStorage.setItem(STARTED_KEY, String(Date.now()));
          } catch (_) {}
        };

        const typeWord = (word, done) => {
          let i = 0;
          animatedTextContainer.classList.remove('is-deleting', 'is-empty');
          animatedWordInner.textContent = '';
          const iv = setInterval(() => {
            if (i < word.length) {
              animatedWordInner.textContent += word[i++];
              animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
            } else { clearInterval(iv); done && done(); }
          }, typingSpeed);
        };

        const deleteWord = (done) => {
          let text = animatedWordInner.textContent;
          animatedTextContainer.classList.add('is-deleting');
          const iv = setInterval(() => {
            if (text.length) {
              text = text.slice(0, -1);
              animatedWordInner.textContent = text;
              animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
            } else {
              clearInterval(iv);
              animatedTextContainer.classList.add('is-empty');
              animatedTextContainer.style.width = '0px';
              done && done();
            }
          }, deletingSpeed);
        };

        const loop = () => {
          const currentWord = words[currentIndex];
          typeWord(currentWord, () => {
            saveCurrentIndex();
            setTimeout(() => {
              deleteWord(() => {
                setTimeout(() => {
                  currentIndex = (currentIndex + 1) % words.length;
                  loop();
                }, pauseBeforeTyping);
              });
            }, wordDisplayTime);
          });
        };

        if (hasSavedIndex) {
          animatedTextContainer.classList.remove('is-deleting', 'is-empty');
          animatedWordInner.textContent = words[currentIndex];
          animatedTextContainer.style.width = `${getTextWidth(animatedWordInner.textContent)}px`;
          const remainingDisplayTime = Math.max(0, wordDisplayTime - (Date.now() - savedWordStartedAt));
          setTimeout(() => {
            deleteWord(() => {
              setTimeout(() => {
                currentIndex = (currentIndex + 1) % words.length;
                loop();
              }, pauseBeforeTyping);
            });
          }, remainingDisplayTime);
        } else {
          saveCurrentIndex();
          loop();
        }
      }

      /* ===== Edge scroll: Experimental -> Projects ===== */
      (function experimentalEdgeNav(){
        const PREV_PATH = '/project/';
        const EDGE_TOP = 2;
        const WHEEL_UP_THRESHOLD = 360;
        const SWIPE_THRESHOLD = 140;
        let navLocked = false;
        let wheelAccum = 0;
        let touchStartY = null;

        function atTop(){
          const y = window.scrollY || document.documentElement.scrollTop || 0;
          return y <= EDGE_TOP;
        }

        function goPrev(){
          if (navLocked) return;
          navLocked = true;
          try { sessionStorage.setItem('projectEdgeStart', 'bottom'); } catch (_) {}
          window.location.href = PREV_PATH;
        }

        function resetEdgeIntent(){
          wheelAccum = 0;
        }

        window.addEventListener('wheel', (e) => {
          if (navLocked) return;
          const dy = e.deltaY || 0;
          if (dy >= 0 || !atTop()) { resetEdgeIntent(); return; }
          wheelAccum += Math.max(dy, -80);
          if (wheelAccum <= -WHEEL_UP_THRESHOLD) goPrev();
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
          touchStartY = e.touches[0]?.clientY ?? null;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
          if (navLocked || touchStartY == null) return;
          const endY = e.changedTouches[0]?.clientY ?? touchStartY;
          const delta = touchStartY - endY;
          touchStartY = null;
          if (atTop() && delta <= -SWIPE_THRESHOLD) {
            goPrev();
            return;
          }
          resetEdgeIntent();
        }, { passive: true });
      })();

      /* ===== Top-to-bottom reveal and lazy media loading ===== */
      const cards = Array.from(document.querySelectorAll('.experimental-grid .card'));
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Reset the interactive "signal" iframe when leaving its card
      const signalIframe = document.querySelector('.experimental-grid .card iframe[data-src*="index_no_curtain.html"], .experimental-grid .card iframe[src*="index_no_curtain.html"]');
      if (signalIframe) {
        const signalCard = signalIframe.closest('.card');
        if (signalCard) {
          signalCard.addEventListener('mouseleave', () => {
            const iframeWindow = signalIframe.contentWindow;
            if (iframeWindow && typeof iframeWindow.resetHeadlineState === 'function') {
              iframeWindow.resetHeadlineState();
            }
          });
        }
      }

      if (!cards.length) return;

      function hydrateMediaElement(media) {
        if (media.dataset.loaded === '1') return;

        if (media.tagName === 'IFRAME' || media.tagName === 'IMG') {
          const src = media.dataset.src;
          if (src) {
            media.src = src;
            media.dataset.loaded = '1';
          }
          return;
        }

        if (media.tagName === 'VIDEO') {
          const src = media.dataset.src;
          if (src) media.src = src;

          media.querySelectorAll('source[data-src]').forEach(source => {
            source.src = source.dataset.src;
            source.removeAttribute('data-src');
          });

          media.preload = 'auto';
          media.dataset.loaded = '1';
          media.load();
          const play = media.play();
          if (play && typeof play.catch === 'function') play.catch(() => {});
        }
      }

      function hydrateCardMedia(card) {
        card.querySelectorAll('video, img, iframe').forEach(hydrateMediaElement);
      }

      function revealCard(card, index) {
        if (card.classList.contains('reveal-in')) return;
        card.style.setProperty('--stagger', prefersReduced ? '0ms' : `${Math.min(index * 60, 720)}ms`);
        card.classList.add('reveal-in');
      }

      requestAnimationFrame(() => {
        cards.forEach((card, index) => revealCard(card, index));
      });

      const hydrateObserver = new IntersectionObserver((entries) => {
        entries
          .filter(e => e.isIntersecting)
          .sort((a, b) => cards.indexOf(a.target) - cards.indexOf(b.target))
          .forEach(entry => {
            hydrateObserver.unobserve(entry.target);
            hydrateCardMedia(entry.target);
          });
      }, {
        root: null,
        rootMargin: '900px 0px',
        threshold: 0.01
      });

      cards.forEach(card => {
        hydrateObserver.observe(card);
        card.addEventListener('mouseenter', () => hydrateCardMedia(card), { once: true });
        card.addEventListener('focusin', () => hydrateCardMedia(card), { once: true });
      });
    });
  </script>
